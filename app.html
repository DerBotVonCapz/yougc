<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marketplace — YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .floatlogo{position:fixed;z-index:60;font-family:'Baloo 2','Poppins',sans-serif;font-weight:800;font-size:2.4rem;line-height:1;
    background:linear-gradient(95deg,#8FB4E0,#A9C6EA,#E3A2C0,#A5D8BE);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 1px rgba(255,255,255,.9)) drop-shadow(0 10px 24px rgba(110,150,200,.45));
    cursor:grab;user-select:none;will-change:transform;left:0;top:0}
  .floatlogo:active{cursor:grabbing}
  .prep{text-align:center;padding:9vh 0 4vh}
  .prep .dots span{display:inline-block;animation:blink 1.4s infinite}
  .prep .dots span:nth-child(2){animation-delay:.2s}
  .prep .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" id="mypage" href="#">my profile</a>
      <a class="nav-cta" href="#" id="logout">log out</a>
    </div>
  </nav>

  <div class="appwrap" id="appwrap">
    <h1 class="page">the <span class="grad">marketplace.</span></h1>

    <div class="card" id="composer" style="display:none;margin-bottom:18px">
      <label style="margin-top:0">your daily post</label>
      <textarea id="postText" maxlength="500" placeholder="what can you shoot right now? where are you? share an idea, an achievement, what you'd love to create next…"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span class="muted">one post per day — make it count</span>
        <button class="btn small" id="postBtn">post</button>
      </div>
      <div class="msg" id="postMsg"></div>
    </div>

    <div class="tabs">
      <span class="tab on" data-tab="all">everyone</span>
      <span class="tab" data-tab="mine">my categories</span>
    </div>
    <div class="chips" id="filterChips" style="margin-bottom:18px"></div>

    <div id="feed"><p class="muted center mt3">loading…</p></div>
  </div>
</div>

<script type="module">
import { sb, requireAuth, NICHES, blobsHTML, initMotion, logoHTML, esc, timeAgo, avatarHTML, showMsg } from './app.js';
import { LAUNCHED } from './config.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML('app.html');
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');
const me = ctx.profile;

document.getElementById('mypage').href = 'profile.html?u=' + encodeURIComponent(me.username);
document.getElementById('logout').addEventListener('click', async e=>{e.preventDefault(); await sb.auth.signOut(); location.href='index.html';});

if(!LAUNCHED){
  // ---------- PRE-LAUNCH HOLDING SCREEN ----------
  document.getElementById('appwrap').innerHTML = `
    <div class="prep">
      <h1 class="page" style="font-size:clamp(2.2rem,5vw,3.8rem);letter-spacing:-.03em">
        marketplace <span class="grad">in preparation</span><span class="dots grad"><span>.</span><span>.</span><span>.</span></span>
      </h1>
      <p class="lead" style="margin:20px auto 0;max-width:540px">
        creators and brands are joining right now. your profile is locked in —
        you'll be here from <b>day one</b> when the doors open.
      </p>
      <p class="muted" style="margin-top:28px">tip: make your profile perfect now. first impressions run the feed.</p>
      <a class="btn mt3" id="prepProfile" href="#">polish my profile →</a>
    </div>`;
  document.getElementById('prepProfile').href = 'profile.html?u=' + encodeURIComponent(me.username);

  // ---------- floating logo you can kick around ----------
  const fl = document.createElement('div');
  fl.className = 'floatlogo';
  fl.textContent = 'YOUgc';
  document.body.appendChild(fl);
  const rect = () => fl.getBoundingClientRect();
  let x = innerWidth*0.2, y = innerHeight*0.6;
  let vx = 2.1, vy = 1.6;
  function loop(){
    const w = rect().width, h = rect().height;
    x += vx; y += vy;
    vx *= 0.999; vy *= 0.999;
    // keep a minimum drift
    const sp = Math.hypot(vx,vy);
    if(sp < 1.2){ vx *= 1.2/Math.max(sp,.01); vy *= 1.2/Math.max(sp,.01); }
    if(sp > 22){ vx *= 22/sp; vy *= 22/sp; }
    if(x < 0){ x = 0; vx = Math.abs(vx)*0.9; }
    if(y < 0){ y = 0; vy = Math.abs(vy)*0.9; }
    if(x + w > innerWidth){ x = innerWidth - w; vx = -Math.abs(vx)*0.9; }
    if(y + h > innerHeight){ y = innerHeight - h; vy = -Math.abs(vy)*0.9; }
    fl.style.transform = `translate(${x}px, ${y}px) rotate(${vx*1.4}deg)`;
    requestAnimationFrame(loop);
  }
  loop();
  // push it with the cursor
  window.addEventListener('mousemove', e=>{
    const w = rect().width, h = rect().height;
    const cx = x + w/2, cy = y + h/2;
    const dx = cx - e.clientX, dy = cy - e.clientY;
    const dist = Math.hypot(dx,dy);
    if(dist < 130 && dist > 1){
      const f = (130-dist)/130 * 2.6;
      vx += (dx/dist)*f; vy += (dy/dist)*f;
    }
  });
  // kick it with a click
  fl.addEventListener('mousedown', e=>{
    e.preventDefault();
    const ang = Math.random()*Math.PI*2;
    vx += Math.cos(ang)*14; vy += Math.sin(ang)*14;
    fl.style.filter = 'drop-shadow(0 3px 1px rgba(255,255,255,.9)) drop-shadow(0 14px 34px rgba(217,139,176,.7))';
    setTimeout(()=>fl.style.filter='',300);
  });

} else {
  // ---------- LIVE MARKETPLACE ----------
  if(me.role === 'creator'){
    document.getElementById('composer').style.display='block';
    document.getElementById('postBtn').addEventListener('click', async ()=>{
      const t = document.getElementById('postText').value.trim();
      const msg = document.getElementById('postMsg'); msg.className='msg';
      if(!t){ showMsg(msg,'write something first.'); return; }
      const btn=document.getElementById('postBtn'); btn.innerHTML='<span class="spin"></span>';
      const { error } = await sb.from('posts').insert({ user_id: me.id, text: t });
      if(error){
        showMsg(msg, (error.message||'').includes('row-level') ? 'you already posted in the last 24 hours — come back tomorrow.' : error.message);
      } else {
        document.getElementById('postText').value='';
        showMsg(msg,'posted. brands can see it now.', true);
        load();
      }
      btn.textContent='post';
    });
  }

  let tab='all', activeNiches=new Set();
  const filterEl=document.getElementById('filterChips');
  filterEl.innerHTML = NICHES.map(n=>`<span class="chip filter" data-n="${esc(n)}">${esc(n)}</span>`).join('');
  filterEl.addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    const n=c.dataset.n;
    activeNiches.has(n)?activeNiches.delete(n):activeNiches.add(n);
    c.classList.toggle('on');
    load();
  });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); tab=t.dataset.tab; load();
  }));

  async function load(){
    const feed=document.getElementById('feed');
    feed.innerHTML='<p class="muted center mt3">loading…</p>';
    const { data, error } = await sb.from('posts')
      .select('id,text,created_at,profiles(id,username,name,avatar_url,niches,role)')
      .order('created_at',{ascending:false}).limit(100);
    if(error){ feed.innerHTML=`<p class="muted center mt3">${esc(error.message)}</p>`; return; }
    let rows = (data||[]).filter(p=>p.profiles);
    rows = rows.filter(p=>p.profiles.role==='creator');
    if(tab==='mine' && me.niches?.length){
      const mine=new Set(me.niches);
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>mine.has(n)));
    }
    if(activeNiches.size){
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>activeNiches.has(n)));
    }
    if(!rows.length){
      feed.innerHTML = `<div class="card center"><p class="muted">nothing here yet${tab==='mine'?' for your categories':''} — check back soon, or switch filters.</p></div>`;
      return;
    }
    feed.innerHTML = rows.map(p=>`
      <div class="card post">
        <div class="phead">
          ${avatarHTML(p.profiles)}
          <div>
            <a class="pname" href="profile.html?u=${encodeURIComponent(p.profiles.username)}">${esc(p.profiles.name)}</a>
            <div class="pmeta">@${esc(p.profiles.username)} · ${timeAgo(p.created_at)}</div>
          </div>
        </div>
        <div class="ptext">${esc(p.text)}</div>
        <div class="ptags">${(p.profiles.niches||[]).slice(0,6).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
      </div>`).join('');
  }
  load();
}
</script>
</body>
</html>

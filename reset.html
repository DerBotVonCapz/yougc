<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="reset your YOUgc password."><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>new password · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane{max-width:640px}
.card{padding:46px 50px}
h1.page{font-size:clamp(2.1rem,4vw,2.8rem)}
.sub{font-size:1.05rem}
input[type=password]{font-size:1rem;padding:16px 18px}
.btn.full{font-size:1.02rem;padding:17px 30px}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top"><span id="logo"></span></nav>
  <div class="pane">
    <div class="card reveal on">
      <h1 class="page">new <span class="grad">password.</span></h1>
      <p class="sub">set a new password for your account.</p>
      <label>new password</label>
      <input type="password" id="pass" placeholder="min 6 characters" autocomplete="new-password">
      <button class="btn full mt2" id="save">save new password</button>
      <div class="msg" id="msg"></div>
      <p class="muted mt2 center" style="font-size:.75rem">stuck? <a href="mailto:yougcmarket@gmail.com" style="color:var(--cblue);font-weight:600">yougcmarket@gmail.com</a> · fast response</p>
    </div>
  </div>
</div>
<script type="module">
import { sb, blobsHTML, initMotion, logoHTML, showMsg } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();
const msg = document.getElementById('msg');
document.getElementById('save').addEventListener('click', async ()=>{
  const v = document.getElementById('pass').value;
  if(v.length < 6){ showMsg(msg,'password needs at least 6 characters.'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showMsg(msg,'open this page through the link in your reset email.'); return; }
  const { error } = await sb.auth.updateUser({ password: v });
  if(error) showMsg(msg, error.message);
  else { showMsg(msg,'password saved. taking you in…', true); setTimeout(()=>location.href='app.html', 1200); }
});
</script>
<script type="module" src="i18n.js"></script>
<script src="cursor.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dashboard · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane{max-width:1220px}
h1.page{font-size:clamp(2.2rem,4.4vw,3.2rem)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}
@media(max-width:1000px){.statgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.statgrid{grid-template-columns:1fr}}
.stat{padding:28px 30px;border-radius:24px;border:3px solid transparent;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,
             linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4,#BFD7F2) border-box;
  box-shadow:0 18px 44px -22px rgba(46,74,115,.3);transition:transform .25s}
.stat:hover{transform:translateY(-4px)}
html.dark .stat{background:linear-gradient(rgba(23,31,52,.96),rgba(23,31,52,.96)) padding-box,
  linear-gradient(120deg,#2E4A73,#8A4B6E,#2C5C46,#2E4A73) border-box}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:2.3rem;font-weight:700;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.panel{margin-top:26px;padding:34px 38px;border-radius:26px;background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 18px 46px -22px rgba(46,74,115,.24)}
html.dark .panel{background:rgba(23,31,52,.94);border-color:rgba(255,255,255,.07)}
.panel h3{font-size:1.2rem;font-weight:800;margin-bottom:18px;letter-spacing:-.01em}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .fill{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#6E96C8,#D98BB0);min-height:4px;transition:height .6s}
.bar .d{font-size:.66rem;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.bar .v{font-size:.75rem;font-weight:800}
.tp{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(30,51,80,.08);font-size:.95rem;font-weight:600}
.tp:last-child{border-bottom:none}
.tp .c{color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top"><span id="logo"></span><a class="nav-cta" href="app.html">marketplace</a></nav>
  <div class="pane">
    <h1 class="page">your <span class="grad">dashboard.</span></h1>
    <p class="sub" id="subline">live numbers from the marketplace.</p>
    <div id="content"><p class="muted mt3">loading…</p></div>
  </div>
</div>
<script type="module">
import { sb, requireAuth, blobsHTML, initMotion, logoHTML } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');

const { data, error } = await sb.rpc('admin_stats');
const box = document.getElementById('content');
if(error){
  box.innerHTML = '<div class="card mt3" style="padding:40px"><b>this page is owner only.</b><p class="muted" style="margin-top:8px">nothing to see here 👀</p></div>';
  throw new Error('not admin');
}
const s = data;
const stat = (n,l)=>`<div class="stat"><div class="n">${n ?? 0}</div><div class="l">${l}</div></div>`;

// 14 day visits chart
const days = [];
for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*86400000); days.push(d.toISOString().slice(0,10)); }
const map = Object.fromEntries((s.daily||[]).map(r=>[r.d, r.c]));
const max = Math.max(1, ...days.map(d=>map[d]||0));
const bars = days.map(d=>`<div class="bar"><span class="v">${map[d]||0}</span><div class="fill" style="height:${Math.round((map[d]||0)/max*120)+4}px"></div><span class="d">${d.slice(5)}</span></div>`).join('');

box.innerHTML = `
  <div class="statgrid">
    ${stat(s.visits_24h,'visits · 24h')}
    ${stat(s.visits_7d,'visits · 7 days')}
    ${stat(s.profiles,'profiles')}
    ${stat(s.new_profiles_7d,'new profiles · 7d')}
    ${stat(s.creators,'creators')}
    ${stat(s.brands,'brands')}
    ${stat(s.posts,'posts')}
    ${stat(s.messages_24h,'messages · 24h')}
    ${stat(s.messages,'messages total')}
    ${stat(s.waitlist,'waitlist emails')}
    ${stat(s.visits_total,'visits all time')}
    ${stat(s.posts_24h,'posts · 24h')}
  </div>
  <div class="grid2 mt2" style="margin-top:26px">
    <div class="panel"><h3>visits, last 14 days 📈</h3><div class="bars">${bars}</div></div>
    <div class="panel"><h3>top pages, 7 days 🔥</h3>${(s.top_pages||[]).map(p=>`<div class="tp"><span>${p.path||'index'}</span><span class="c">${p.c}</span></div>`).join('') || '<p class="muted">no data yet</p>'}</div>
  </div>`;
</script>
</body>
</html>

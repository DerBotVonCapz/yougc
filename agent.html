<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="your personal YOUgc agent: pricing, profile help and post ideas."><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>your agent · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane.wide{max-width:1020px}
.agwrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:480px;padding:0;overflow:hidden;border:3px solid transparent;border-radius:28px;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4,#BFD7F2) border-box}
html.dark .agwrap{background:linear-gradient(rgba(20,28,46,.96),rgba(20,28,46,.96)) padding-box,linear-gradient(120deg,#2E4A73,#8A4B6E,#2C5C46,#2E4A73) border-box}
.aghead{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1.5px solid rgba(30,51,80,.08);font-weight:800;font-size:1.15rem;font-family:'Space Grotesk',sans-serif}
html.dark .aghead{border-bottom-color:rgba(255,255,255,.1)}
.aglog{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.agb{max-width:82%;padding:13px 18px;border-radius:18px;font-size:.98rem;line-height:1.65;white-space:pre-wrap;animation:bubIn .25s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.agb.me{align-self:flex-end;background:linear-gradient(120deg,#2E4A73,#48688F);color:#fff;border-bottom-right-radius:6px}
.agb.ai{align-self:flex-start;background:rgba(191,215,242,.28);border:1.5px solid rgba(30,51,80,.08);border-bottom-left-radius:6px}
html.dark .agb.ai{background:#1B2440;border-color:rgba(255,255,255,.1)}
.agbar{display:flex;gap:10px;padding:16px 20px;border-top:1.5px solid rgba(30,51,80,.08)}
html.dark .agbar{border-top-color:rgba(255,255,255,.1)}
.agbar input{flex:1;font-size:1rem;padding:15px 18px}
.lockcard{text-align:center;padding:60px 40px}
.lockcard h2{font-size:1.9rem;font-weight:800;font-family:'Space Grotesk',sans-serif;margin-bottom:12px}
.lockcard p{color:var(--ink-soft);line-height:1.75;max-width:520px;margin:0 auto 26px;font-size:1.05rem}
.btn.agbuy{background:linear-gradient(120deg,#6E96C8,#D98BB0);color:#fff;font-size:1.08rem;padding:18px 40px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}
.sugg span{font-size:.8rem;font-weight:600;padding:8px 16px;border-radius:999px;background:rgba(191,215,242,.35);cursor:pointer;transition:transform .2s}
.sugg span:hover{transform:translateY(-2px)}
html.dark .sugg span{background:rgba(110,150,200,.16)}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="app.html">marketplace</a>
      <a class="nav-cta" href="chat.html">chats</a>
      <a class="nav-cta" id="mypage" href="#">my profile</a>
    </div>
  </nav>

  <div class="pane wide" id="pane"><div class="card center"><p class="muted">loading…</p></div></div>
</div>

<script type="module">
import { sb, requireAuth, blobsHTML, initMotion, logoHTML, esc } from './app.js';
import { SUPABASE_URL, SUPABASE_KEY, AGENT_PRICE } from './config.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');
const me = ctx.profile;
document.getElementById('mypage').href = 'profile.html?u=' + encodeURIComponent(me.username);
const pane = document.getElementById('pane');
const roleWord = me.role === 'brand' ? 'brand' : 'creator';
const active = me.agent_until && new Date(me.agent_until) > new Date();

if(!active){
  const payHref = 'pay.html?perk=agent&item=' + encodeURIComponent(roleWord + ' agent @' + me.username) + '&price=' + AGENT_PRICE;
  pane.innerHTML = `<div class="card lockcard reveal on">
    <h2>your personal <span class="grad">${roleWord} agent</span> ✨</h2>
    <p>an agent that knows your profile and works only for you. sharper bio, better posts, more recognition, cleaner deal setups in your DMs. feed it your goals, it remembers everything and pushes your value up.</p>
    <a class="btn agbuy" href="${payHref}">unlock my agent · $${AGENT_PRICE}/month</a>
    <p class="muted mt2" style="font-size:.85rem">active within a few hours after payment. cancel anytime.</p>
  </div>`;
} else {
  pane.innerHTML = `<div class="agwrap card reveal on">
    <div class="aghead">✨ your <span class="grad">${roleWord} agent</span></div>
    <div class="aglog" id="log"></div>
    <div class="sugg" id="sugg">
      <span>make my bio better</span>
      <span>what should i post this week?</span>
      <span>how do i get more ${me.role==='brand'?'creators':'brand deals'}?</span>
      <span>write my next DM</span>
    </div>
    <div class="agbar">
      <input type="text" id="inp" maxlength="1000" placeholder="tell your agent what you want…">
      <button class="btn small" id="send">send</button>
    </div>
  </div>`;

  const log = document.getElementById('log');
  const add = (cls, text) => { log.insertAdjacentHTML('beforeend', `<div class="agb ${cls}">${esc(text)}</div>`); log.scrollTop = log.scrollHeight; };

  const { data: hist } = await sb.from('agent_msgs').select('role,text').eq('user_id', me.id).order('created_at',{ascending:true}).limit(60);
  if(hist && hist.length) hist.forEach(m => add(m.role==='user'?'me':'ai', m.text));
  else add('ai', `hey ${me.name.split(' ')[0]} 👋 i'm your ${roleWord} agent. i know your profile already. tell me what you're trying to achieve and i'll help you get there: bio, posts, visibility, deals.`);

  let busy = false;
  async function send(msgOverride){
    if(busy) return;
    const inp = document.getElementById('inp');
    const t = (msgOverride || inp.value).trim();
    if(!t) return;
    inp.value = '';
    busy = true;
    add('me', t);
    log.insertAdjacentHTML('beforeend', `<div class="agb ai" id="think">thinking…</div>`);
    log.scrollTop = log.scrollHeight;
    try{
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch(SUPABASE_URL + '/functions/v1/agent', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token, 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ message: t })
      });
      const out = await r.json();
      document.getElementById('think').remove();
      if(out.reply) add('ai', out.reply);
      else if(out.error === 'agent_locked') add('ai', 'your agent access ran out. renew it from your profile to keep going.');
      else add('ai', out.error || 'something went wrong, try again.');
    }catch(e){
      const th = document.getElementById('think'); if(th) th.remove();
      add('ai', 'connection hiccup, try again.');
    }
    busy = false;
  }
  document.getElementById('send').addEventListener('click', ()=>send());
  document.getElementById('inp').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  document.getElementById('sugg').addEventListener('click', e=>{ const s=e.target.closest('span'); if(s) send(s.textContent); });
}
</script>
</body>
</html>

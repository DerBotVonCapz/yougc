<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="your YOUgc chats. deals happen here."><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chats · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.chatGrid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;margin-top:10px;height:calc(100vh - 210px);min-height:440px}
@media(max-width:820px){.chatGrid{grid-template-columns:1fr;height:auto}.convs{max-height:220px}}
.convs{overflow-y:auto;height:100%;padding:14px}
.conv{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;cursor:pointer;transition:background .2s}
.conv:hover{background:rgba(191,215,242,.35)}
.conv.on{background:rgba(191,215,242,.55)}
.conv .avatar{width:42px;height:42px}
.conv .cname{font-weight:700;font-size:.87rem;display:inline-flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .clast{font-size:.75rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.thread{display:flex;flex-direction:column;height:100%;padding:0;overflow:hidden}
.thead{display:flex;align-items:center;gap:11px;padding:15px 20px;border-bottom:1.5px solid rgba(30,51,80,.08);font-weight:700}
.thead .avatar{width:38px;height:38px}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:74%;padding:10px 15px;border-radius:18px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:bubIn .25s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bubble.me{align-self:flex-end;background:linear-gradient(120deg,#2E4A73,#48688F);color:#fff;border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.92);border:1.5px solid rgba(30,51,80,.08);border-bottom-left-radius:6px}
.btime{font-size:.62rem;opacity:.6;margin-top:3px}
.msgbar{display:flex;gap:9px;padding:13px 16px;border-top:1.5px solid rgba(30,51,80,.08)}
.msgbar input{flex:1}
.emptyc{color:var(--ink-soft);font-size:.88rem;text-align:center;margin:auto;line-height:1.7}
.limitbar{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:90;
  display:flex;align-items:center;gap:11px;max-width:min(92vw,520px);padding:15px 22px;border-radius:18px;
  background:linear-gradient(120deg,#2E4A73,#6E96C8);color:#fff;font-size:.94rem;font-weight:700;line-height:1.45;
  box-shadow:0 24px 54px -20px rgba(46,74,115,.85);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.limitbar.on{opacity:1;transform:translate(-50%,0)}
.limitbar .lbi{flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.22);font-weight:800}
.conv{align-items:center}
.ctop{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.cwhen{flex:none;font-size:.7rem;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.conv.unread .cname{font-weight:800}
.conv.unread .clast{color:var(--ink);font-weight:600}
.cyou{color:var(--ink-soft);font-weight:600}
.cdot{flex:none;min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;font-size:.66rem;font-weight:800;color:#fff;
  background:linear-gradient(120deg,#6E96C8,#D98BB0)}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="app.html">Marketplace</a>
      <a class="nav-cta" id="mypage" href="#">My profile</a>
    </div>
  </nav>

  <div class="appwrap">
    <h1 class="page big">Cha<span class="grad">ts</span></h1>
    <div class="chatGrid">
      <div style="display:flex;flex-direction:column;gap:14px;height:100%;min-height:0">
        <div class="card" id="notifBox" style="display:none;padding:14px 16px"></div>
        <div class="card convs" id="convList" style="flex:1;min-height:0"><p class="muted center mt2">loading…</p></div>
      </div>
      <div class="card thread">
        <div class="thead" id="thead"><span class="muted" style="font-weight:500">pick a chat, or hit "message" on any profile</span></div>
        <div class="msgs" id="msgs"><div class="emptyc">no chat open.<br>find creators and brands on the marketplace and message them.</div></div>
        <div class="msgbar" style="display:none" id="msgbar">
          <button class="btn small ghost" id="attBtn" title="send a photo, video or file" style="padding:10px 15px;font-size:1rem">📎</button>
          <input type="file" id="attFile" style="display:none">
          <input type="text" id="msgText" maxlength="1000" placeholder="write a message…">
          <button class="btn small" id="sendBtn">send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { sb, requireAuth, blobsHTML, initMotion, logoHTML, esc, safeUrl, timeAgo, avatarHTML, vbadge, hasSlurs, track } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');
const me = ctx.profile;
document.getElementById('mypage').href = 'profile.html?u=' + encodeURIComponent(me.username);

let partners = new Map();   // id -> profile
let active = null;          // partner profile
let lastMsgId = 0;

async function loadAll(){
  const { data: msgs } = await sb.from('messages').select('*')
    .or(`sender.eq.${me.id},recipient.eq.${me.id}`)
    .order('created_at',{ascending:false}).limit(400);
  const byPartner = new Map();
  for(const m of (msgs||[])){
    const pid = m.sender === me.id ? m.recipient : m.sender;
    if(!byPartner.has(pid)) byPartner.set(pid, { last:m, unread:0, msgs:[] });
    const e = byPartner.get(pid);
    e.msgs.push(m);
    if(m.recipient === me.id && !m.read) e.unread++;
  }
  const ids = [...byPartner.keys()].filter(id => !partners.has(id));
  if(ids.length){
    const { data: profs } = await sb.from('profiles').select('*').in('id', ids);
    (profs||[]).forEach(p => partners.set(p.id, p));
  }
  renderConvs(byPartner);
  if(active && byPartner.has(active.id)) renderThread(byPartner.get(active.id).msgs);
  return byPartner;
}

function renderConvs(byPartner){
  const el = document.getElementById('convList');
  const rows = [...byPartner.entries()]
    .sort((a,b)=> new Date(b[1].last.created_at) - new Date(a[1].last.created_at))
    .map(([pid, e])=>{
    const p = partners.get(pid); if(!p) return '';
    const mine = e.last.sender === me.id;
    const preview = (e.last.att && !e.last.text ? '📎 attachment' : e.last.text) || '';
    return `<div class="conv ${active&&active.id===pid?'on':''}${e.unread?' unread':''}" data-id="${pid}">
      ${avatarHTML(p)}
      <div style="min-width:0;flex:1">
        <div class="ctop"><span class="cname">${esc(p.name)}${vbadge(p)}</span><span class="cwhen">${timeAgo(e.last.created_at)}</span></div>
        <div class="clast">${mine?'<span class="cyou">you:</span> ':''}${esc(preview.length>52?preview.slice(0,52)+'…':preview)}</div>
      </div>
      ${e.unread?`<span class="cdot">${e.unread>9?'9+':e.unread}</span>`:''}
    </div>`;
  }).join('');
  el.innerHTML = rows || '<p class="muted center mt2">no chats yet.<br>message someone from their profile.</p>';
  el.querySelectorAll('.conv').forEach(c => c.addEventListener('click', ()=> openThread(partners.get(c.dataset.id))));
}

async function openThread(p){
  if(!p) return;
  active = p;
  document.getElementById('thead').innerHTML = `${avatarHTML(p)} <a href="profile.html?u=${encodeURIComponent(p.username)}" style="color:var(--ink);text-decoration:none;display:flex;align-items:center">${esc(p.name)}${vbadge(p)}</a> <span class="rolebadge ${p.role}" style="margin-left:4px">${p.role}</span>`;
  document.getElementById('msgbar').style.display='flex';
  const byPartner = await loadAll();
  const e = byPartner.get(p.id);
  renderThread(e ? e.msgs : []);
  // mark read
  await sb.from('messages').update({ read:true }).eq('recipient', me.id).eq('sender', p.id).eq('read', false);
}

function renderThread(msgs){
  const el = document.getElementById('msgs');
  const sorted = [...msgs].sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const maxId = sorted.length ? sorted[sorted.length-1].id : 0;
  el.innerHTML = sorted.map(m=>{
    let att='';
    if(m.att && safeUrl(m.att.url)){
      const u=esc(safeUrl(m.att.url)), ty=String(m.att.type||'');
      if(ty.startsWith('image/')) att=`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" style="max-width:100%;max-height:340px;border-radius:12px;display:block;margin-bottom:6px" loading="lazy"></a>`;
      else if(ty.startsWith('video/')) att=`<video src="${u}" controls style="max-width:100%;max-height:340px;border-radius:12px;display:block;margin-bottom:6px"></video>`;
      else att=`<a href="${u}" target="_blank" rel="noopener" style="display:block;font-weight:700;margin-bottom:4px;color:inherit">📎 ${esc(m.att.name||'file')}</a>`;
    }
    const hideText = att && m.text && m.text.startsWith('📎 ');
    return `<div class="bubble ${m.sender===me.id?'me':'them'}">${att}${hideText?'':esc(m.text)}<div class="btime">${timeAgo(m.created_at)}</div></div>`;
  }).join('')
    || '<div class="emptyc">say hi. keep it professional, deals start here.</div>';
  if(nearBottom || maxId > lastMsgId) el.scrollTop = el.scrollHeight;
  lastMsgId = maxId;
}

async function send(){
  const inp = document.getElementById('msgText');
  const t = inp.value.trim();
  if(!t || !active) return;
  if(hasSlurs(t)){ inp.value=''; inp.placeholder='that language has no place here.'; return; }
  inp.value=''; inp.placeholder='write a message…';
  const { error } = await sb.from('messages').insert({ sender: me.id, recipient: active.id, text: t });
  if(error){ inp.value = t; showLimit(error.message); return; }
  await loadAll();
}

// friendly wall for the anti-spam limits coming back from the database
function showLimit(raw){
  let m = String(raw||'').replace(/^.*?(?:violates|error:)\s*/i,'').trim();
  if(!m || /duplicate key|permission denied|jwt|row-level/i.test(m)) m = 'that did not send. give it a second and try again.';
  try{ track('chat·blocked·' + m.slice(0,40)); }catch(e){}
  let el = document.getElementById('limitBar');
  if(!el){
    el = document.createElement('div'); el.id = 'limitBar'; el.className = 'limitbar';
    document.body.appendChild(el);
  }
  el.innerHTML = '<span class="lbi">!</span><span>' + esc(m) + '</span>';
  el.classList.add('on');
  clearTimeout(window.__lt);
  window.__lt = setTimeout(()=>el.classList.remove('on'), 6500);
}
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('msgText').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });

// attachments: photos, videos, files
const attBtn = document.getElementById('attBtn'), attFile = document.getElementById('attFile');
attBtn.addEventListener('click', ()=>{ if(active) attFile.click(); });
attFile.addEventListener('change', async ()=>{
  const f = attFile.files[0]; attFile.value='';
  const inp = document.getElementById('msgText');
  if(!f || !active) return;
  if(f.size > 25*1024*1024){ inp.value=''; inp.placeholder='max file size is 25 MB.'; return; }
  attBtn.disabled = true; attBtn.textContent = '⏳';
  try{
    const safe = f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-60);
    const path = `${me.id}/${Date.now()}_${safe}`;
    const { error: upErr } = await sb.storage.from('chatfiles').upload(path, f);
    if(upErr) throw upErr;
    const url = sb.storage.from('chatfiles').getPublicUrl(path).data.publicUrl;
    const t = inp.value.trim();
    if(t && hasSlurs(t)){ inp.value=''; inp.placeholder='that language has no place here.'; throw new Error('slur'); }
    inp.value='';
    const { error } = await sb.from('messages').insert({
      sender: me.id, recipient: active.id,
      text: t || ('📎 ' + f.name.slice(0,80)),
      att: { url, type: f.type, name: f.name, size: f.size }
    });
    if(error) throw error;
    await loadAll();
  }catch(err){ if((err.message||'')!=='slur'){ showLimit(err.message || 'upload failed. try again.'); } }
  attBtn.disabled = false; attBtn.textContent = '📎';
});

// notifications: new followers
(async ()=>{
  const { data: fol } = await sb.from('follows').select('follower,seen,created_at').eq('followed', me.id).order('created_at',{ascending:false}).limit(8);
  if(fol && fol.length){
    const ids = fol.map(f=>f.follower);
    const { data: profs } = await sb.from('profiles').select('id,username,name,verified').in('id', ids);
    const pm = new Map((profs||[]).map(p=>[p.id,p]));
    const box = document.getElementById('notifBox');
    box.style.display='block';
    box.innerHTML = '<div style="font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px">🔔 notifications</div>' +
      fol.map(f=>{
        const p = pm.get(f.follower); if(!p) return '';
        return `<div style="font-size:.82rem;line-height:1.7;${f.seen?'opacity:.55':''}"><a href="profile.html?u=${encodeURIComponent(p.username)}" style="font-weight:700;color:var(--ink);text-decoration:none">@${esc(p.username)}</a> started following you · ${timeAgo(f.created_at)}</div>`;
      }).join('');
    await sb.from('follows').update({ seen:true }).eq('followed', me.id).eq('seen', false);
  }
})();

// deep link: chat.html?u=username
const uq = new URLSearchParams(location.search).get('u');
await loadAll();
if(uq){
  const { data: p } = await sb.from('profiles').select('*').eq('username', uq).maybeSingle();
  if(p && p.id !== me.id){ partners.set(p.id, p); openThread(p); }
}

// light polling so replies appear
setInterval(loadAll, 6000);
</script>
<script type="module" src="i18n.js"></script>
<script src="cursor.js?v=3" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>join youGC</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane{max-width:1040px}
.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start}
@media(max-width:820px){.authgrid{grid-template-columns:1fr;gap:10px}}
.card{padding:48px 52px}
h1.page{font-size:clamp(2.2rem,4.4vw,3.1rem)}
.sub{font-size:1.08rem}
label{font-size:.82rem}
input[type=email],input[type=password]{font-size:1rem;padding:16px 18px}
.btn.full{font-size:1.02rem;padding:17px 30px}
.rolecard{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:18px;background:rgba(255,255,255,.75);border:2px solid rgba(30,51,80,.12);cursor:pointer;font-weight:700;font-size:1.05rem;margin-top:14px;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.rolecard:hover{transform:translateY(-2px)}
.rolecard.on{border-color:transparent;background:linear-gradient(120deg,rgba(191,215,242,.85),rgba(244,207,223,.8));box-shadow:0 14px 30px -16px rgba(46,74,115,.45)}
.rolecard .ric{font-size:1.6rem}
.rolecard .rsub{display:block;font-weight:500;font-size:.82rem;color:var(--ink-soft);margin-top:2px}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top"><span id="logo"></span><a class="nav-cta" href="index.html">back</a></nav>
  <div class="pane">
    <div class="card reveal on">
      <div class="authgrid">
        <div>
          <h1 class="page" id="title">create your account</h1>
          <p class="sub" id="subtitle">two minutes and you're in.</p>

          <div id="roleRow">
            <div class="rolecard" data-role="creator"><span class="ric">🎬</span><span>i'm a creator<span class="rsub">i make content and want deals</span></span></div>
            <div class="rolecard" data-role="brand"><span class="ric">🛍️</span><span>i need creators<span class="rsub">i want real content for my brand</span></span></div>
          </div>

          <p class="muted mt3" id="switchline">already have an account? <a href="#" id="switch" style="color:var(--cblue);font-weight:600">log in</a></p>
          <p class="muted mt1"><a href="#" id="forgot" style="color:var(--cblue);font-weight:600">forgot your password?</a></p>
          <p class="muted mt2" style="font-size:.78rem">trouble logging in? <a href="mailto:yougcmarket@gmail.com" style="color:var(--cblue);font-weight:600">yougcmarket@gmail.com</a> · fast response</p>
        </div>

        <div>
          <label style="margin-top:0">email</label>
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
          <label>password</label>
          <input type="password" id="password" placeholder="min 6 characters" autocomplete="new-password">

          <button class="btn full mt2" id="go">create account</button>
          <div class="center muted" style="margin-top:14px">or</div>
          <button class="btn google full mt1" id="gbtn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C41.4 34.9 44 29.9 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            continue with Google
          </button>
          <div class="msg" id="msg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
const _ref = new URLSearchParams(location.search).get('ref');
if(_ref) try{ localStorage.setItem('yougc_ref', _ref); }catch(e){}

import { sb, myProfile, blobsHTML, initMotion, logoHTML, showMsg } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const params = new URLSearchParams(location.search);
let mode = params.get('mode') === 'login' ? 'login' : 'signup';
let role = params.get('role') === 'brand' ? 'brand' : (params.get('role') === 'creator' ? 'creator' : null);

const title = document.getElementById('title'), subtitle = document.getElementById('subtitle');
const roleRow = document.getElementById('roleRow'), go = document.getElementById('go');
const sw = document.getElementById('switch'), switchline = document.getElementById('switchline');
const msg = document.getElementById('msg');

function paintRole(){
  [...roleRow.children].forEach(c => c.classList.toggle('on', c.dataset.role === role));
}
roleRow.addEventListener('click', e => {
  const c = e.target.closest('.rolecard'); if(!c) return;
  role = c.dataset.role; paintRole();
});
paintRole();

function paintMode(){
  if(mode === 'login'){
    title.textContent = 'welcome back';
    subtitle.textContent = 'log in to your account.';
    go.textContent = 'log in';
    roleRow.style.display = 'none';
    subtitle.textContent = 'good to see you again.';
    switchline.firstChild.textContent = "new here? ";
    sw.textContent = 'create an account';
  } else {
    title.textContent = 'create your account';
    subtitle.textContent = "two minutes and you're in.";
    go.textContent = 'create account';
    roleRow.style.display = 'block';
    switchline.firstChild.textContent = 'already have an account? ';
    sw.textContent = 'log in';
  }
}
document.getElementById('forgot').addEventListener('click', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if(!email){ showMsg(msg,'type your email above first, then click forgot password.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/reset.html' });
  if(error) showMsg(msg, error.message);
  else showMsg(msg,'reset link sent. check your inbox.', true);
});
sw.addEventListener('click', e => { e.preventDefault(); mode = mode==='login'?'signup':'login'; paintMode(); });
paintMode();

// already logged in? route forward
(async()=>{
  const p = await myProfile().catch(()=>null);
  const { data:{ user } } = await sb.auth.getUser();
  if(user){ location.href = p ? 'app.html' : 'onboard.html'; }
})();

document.getElementById('gbtn').addEventListener('click', async () => {
  sessionStorage.setItem('yougc_role', role || 'creator');
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + '/auth.html' } });
});

go.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  msg.className = 'msg';
  if(!email || password.length < 6){ showMsg(msg,'enter a valid email and a password with at least 6 characters.'); return; }
  if(mode === 'signup' && !role){ showMsg(msg,'pick one: are you a creator, or do you need creators?'); return; }
  go.innerHTML = '<span class="spin"></span>';
  try{
    if(mode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(!data.session){
        // email confirmation may be ON in supabase. try direct login anyway
        const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
        if(e2){ showMsg(msg,'account created. check your email to confirm, then log in.', true); go.textContent='create account'; return; }
      }
      sessionStorage.setItem('yougc_role', role);
      location.href = 'onboard.html';
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      const p = await myProfile();
      location.href = p ? 'app.html' : 'onboard.html';
    }
  }catch(err){
    showMsg(msg, err.message || 'something went wrong. try again.');
    go.textContent = mode==='login' ? 'log in' : 'create account';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dashboard · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane{max-width:1420px}
h1.page{font-size:clamp(2.2rem,4.4vw,3.2rem)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}
@media(max-width:1000px){.statgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.statgrid{grid-template-columns:1fr}}
.stat{padding:28px 30px;border-radius:24px;border:3px solid transparent;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,
             linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4,#BFD7F2) border-box;
  box-shadow:0 18px 44px -22px rgba(46,74,115,.3);transition:transform .25s}
.stat:hover{transform:translateY(-4px)}
html.dark .stat{background:linear-gradient(rgba(23,31,52,.96),rgba(23,31,52,.96)) padding-box,
  linear-gradient(120deg,#2E4A73,#8A4B6E,#2C5C46,#2E4A73) border-box}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:2.3rem;font-weight:700;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.panel{margin-top:26px;padding:34px 38px;border-radius:26px;background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 18px 46px -22px rgba(46,74,115,.24)}
html.dark .panel{background:rgba(23,31,52,.94);border-color:rgba(255,255,255,.07)}
.panel h3{font-size:1.2rem;font-weight:800;margin-bottom:18px;letter-spacing:-.01em}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .fill{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#6E96C8,#D98BB0);min-height:4px;transition:height .6s}
.bar .d{font-size:.66rem;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.bar .v{font-size:.75rem;font-weight:800}
.tp{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(30,51,80,.08);font-size:.95rem;font-weight:600}
.tp:last-child{border-bottom:none}
.tp .c{color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.funnel{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;margin-top:6px}
.fstep{flex:1;min-width:150px;padding:20px 18px;text-align:center;position:relative}
.fstep .fn{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.03em;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.fstep .fl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-top:6px}
.fstep .fr{font-size:.76rem;font-weight:700;color:#5FB78B;margin-top:5px}
.fstep+.fstep::before{content:'→';position:absolute;left:-10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);opacity:.5;font-size:1.1rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid rgba(30,51,80,.12)}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(30,51,80,.06);font-weight:600}
.tbl tr:hover td{background:rgba(191,215,242,.16)}
.scroll{max-height:420px;overflow-y:auto}
.pill{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.pill.creator{background:#DCE9F9;color:#2E4A73}.pill.brand{background:#FBE3EE;color:#8A4B6E}
.pill.none{background:rgba(30,51,80,.09);color:var(--ink-soft)}
.warn{background:rgba(232,146,107,.18);color:#8A4B1E}
.copybar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.copybar button{cursor:pointer;font-family:'Poppins',sans-serif;font-weight:700;font-size:.8rem;padding:9px 18px;border-radius:999px;border:1.5px solid rgba(30,51,80,.16);background:rgba(255,255,255,.7);color:var(--ink)}
.copybar button:hover{background:var(--ink);color:#fff}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:1000px){.grid2b{grid-template-columns:1fr}}
.refresh{font-size:.8rem;font-weight:700;color:var(--ink-soft);cursor:pointer;text-decoration:underline}
.ctrl{margin-top:26px;padding:30px 32px;border-radius:26px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(46,74,115,.97),rgba(110,150,200,.93));color:#fff;
  box-shadow:0 26px 60px -28px rgba(46,74,115,.8)}
.ctrl h3{color:#fff;margin-bottom:6px}
.ctrl .csub{font-size:.88rem;opacity:.8;margin-bottom:18px}
.cform{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cform select,.cform input{font-family:'Poppins',sans-serif;font-weight:600;font-size:.9rem;padding:12px 15px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);color:#fff;outline:none;margin:0}
.cform select option{color:#1E3350}
.cform input::placeholder{color:rgba(255,255,255,.55)}
.cform input{min-width:170px}
.cgo{cursor:pointer;font-family:'Poppins',sans-serif;font-weight:800;font-size:.9rem;padding:12px 26px;border-radius:999px;
  border:none;background:#fff;color:#1E3350}
.cgo:hover{background:#BFE8D4}
.cout{margin-top:14px;font-size:.88rem;font-weight:700;min-height:1.2em}
.cout.ok{color:#BFE8D4}.cout.bad{color:#F7C9C9}
.feed{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.fev{display:flex;gap:11px;align-items:baseline;padding:9px 4px;border-bottom:1px solid rgba(30,51,80,.06);font-size:.87rem;font-weight:600}
.fev .k{flex:none;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:999px}
.k.signup{background:#DCE9F9;color:#2E4A73}.k.post{background:#FBE3EE;color:#8A4B6E}
.k.chat{background:#D6EFE1;color:#245C42}.k.gig{background:rgba(232,146,107,.24);color:#8A4B1E}
.fev .w{color:var(--ink-soft);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fev .t{flex:none;font-size:.72rem;color:var(--ink-soft)}
.rls{display:flex;flex-wrap:wrap;gap:8px}
.rls span{font-size:.74rem;font-weight:700;padding:7px 13px;border-radius:999px;background:#D6EFE1;color:#245C42}
.rls span.bad{background:#FBD5D5;color:#8A2E2E}
.act{display:flex;gap:5px;flex-wrap:wrap}
.act button{cursor:pointer;font-family:'Poppins',sans-serif;font-weight:700;font-size:.68rem;padding:5px 10px;border-radius:999px;
  border:1.5px solid rgba(30,51,80,.16);background:rgba(255,255,255,.7);color:var(--ink)}
.act button:hover{background:var(--ink);color:#fff}
.act button.danger{border-color:rgba(180,60,60,.4);color:#A63A3A}
.act button.danger:hover{background:#A63A3A;color:#fff}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top"><span id="logo"></span><a class="nav-cta" href="app.html">Marketplace</a></nav>
  <div class="pane">
    <h1 class="page">Your <span class="grad">dashboard.</span></h1>
    <p class="sub" id="subline">live numbers from the marketplace.</p>
    <div id="content"><p class="muted mt3">loading…</p></div>
  </div>
</div>
<script type="module">
import { sb, requireAuth, blobsHTML, initMotion, logoHTML } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');

const { data, error } = await sb.rpc('admin_stats');
const box = document.getElementById('content');
if(error){
  box.innerHTML = '<div class="card mt3" style="padding:40px"><b>this page is owner only.</b><p class="muted" style="margin-top:8px">nothing to see here 👀</p></div>';
  throw new Error('not admin');
}
const s = data;
const { data: sec } = await sb.rpc('admin_security');
const SEC = sec || {};
const { data: pays } = await sb.rpc('admin_payments');
const PAYS = pays || [];
const stat = (n,l)=>`<div class="stat"><div class="n">${n ?? 0}</div><div class="l">${l}</div></div>`;

// 14 day visits chart
const days = [];
for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*86400000); days.push(d.toISOString().slice(0,10)); }
const map = Object.fromEntries((s.daily||[]).map(r=>[r.d, r.c]));
const max = Math.max(1, ...days.map(d=>map[d]||0));
const bars = days.map(d=>`<div class="bar"><span class="v">${map[d]||0}</span><div class="fill" style="height:${Math.round((map[d]||0)/max*120)+4}px"></div><span class="d">${d.slice(5)}</span></div>`).join('');

const pct = (a,b)=> b ? Math.round(a/b*100)+'%' : '0%';
const esc2 = t => String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function when(ts){
  if(!ts) return '';
  const d = (Date.now() - new Date(ts).getTime())/1000;
  if(d < 60) return 'now';
  if(d < 3600) return Math.floor(d/60)+'m';
  if(d < 86400) return Math.floor(d/3600)+'h';
  return Math.floor(d/86400)+'d';
}

const users = s.users||[];
const wl = s.waitlist_emails||[];
const clicks = s.clicks||[];

box.innerHTML = `
  <div class="statgrid">
    ${stat(s.visits_24h,'visits · 24h')}
    ${stat(s.visits_7d,'visits · 7 days')}
    ${stat(s.signups_total,'accounts total')}
    ${stat(s.signups_7d,'new accounts · 7d')}
    ${stat(s.profiles,'finished profiles')}
    ${stat(s.creators,'creators')}
    ${stat(s.brands,'brands')}
    ${stat(s.verified_now,'verified now')}
    ${stat(s.posts,'posts')}
    ${stat(s.messages,'messages')}
    ${stat(s.waitlist,'waitlist emails')}
    ${stat(s.visits_total,'visits all time')}
  </div>

  <div class="ctrl">
    <h3>control</h3>
    <div class="csub">everything here happens instantly and only you can run it.</div>
    <div class="cform">
      <select id="cAction">
        <option value="verify">verify (days)</option>
        <option value="unverify">remove verified</option>
        <option value="pin_profile">pin profile (hours)</option>
        <option value="unpin_profile">unpin profile</option>
        <option value="pin_post">pin post (post id, hours)</option>
        <option value="unpin_post">unpin post (post id)</option>
        <option value="agent">give agent (days)</option>
        <option value="ban">ban user</option>
        <option value="unban">unban user</option>
        <option value="delete_post">delete post (post id)</option>
        <option value="delete_user">delete account</option>
      </select>
      <input id="cTarget" placeholder="@username or post id">
      <input id="cArg" placeholder="30" style="min-width:90px">
      <button class="cgo" id="cGo">run</button>
    </div>
    <div class="cout" id="cOut"></div>
  </div>

  <div class="statgrid" style="margin-top:22px">
    ${stat(SEC.dm_24h,'dms · 24h')}
    ${stat(SEC.new_chats_24h,'new chats · 24h')}
    ${stat(SEC.emails_24h,'emails sent · 24h')}
    ${stat((SEC.banned||[]).length,'banned accounts')}
  </div>

  ${PAYS.length ? `<div class="panel">
    <h3>crypto payments (${PAYS.filter(x=>x.status==='new').length} waiting) 🪙</h3>
    <p class="muted" style="margin-bottom:14px;font-size:.9rem">people who paid in crypto and pasted their transaction. check the link, then switch the perk on and mark it done.</p>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>when</th><th>user</th><th>perk</th><th>coin</th><th>transaction</th><th>status</th><th>actions</th></tr></thead>
      <tbody>${PAYS.map(x=>`<tr${x.status==='new'?' style="background:rgba(232,146,107,.1)"':''}>
        <td class="muted">${when(x.created_at)}</td>
        <td><b>@${esc2(x.username||'')}</b></td>
        <td>${esc2(x.perk)}</td>
        <td>${esc2(x.coin||'—')}</td>
        <td>${x.tx && /^https?:\/\//.test(x.tx) ? `<a href="${esc2(x.tx)}" target="_blank" rel="noopener" style="color:var(--cblue);font-weight:700">open ↗</a>` : esc2((x.tx||'').slice(0,26))}</td>
        <td><span class="pill ${x.status==='new'?'warn':'none'}">${esc2(x.status)}</span></td>
        <td><div class="act">
          ${x.perk==='verified' ? `<button data-a="verify" data-t="${esc2(x.username||'')}" data-g="30">verify 30d</button>` : ''}
          ${x.perk==='pin_profile' ? `<button data-a="pin_profile" data-t="${esc2(x.username||'')}" data-g="24">pin 24h</button>` : ''}
          ${x.perk==='agent' ? `<button data-a="agent" data-t="${esc2(x.username||'')}" data-g="30">agent 30d</button>` : ''}
          <button data-p="${x.id}" data-s="done">mark done</button>
          <button class="danger" data-p="${x.id}" data-s="rejected">reject</button>
        </div></td></tr>`).join('')}</tbody>
    </table></div>
  </div>` : ''}

  <div class="panel">
    <h3>your data 💾</h3>
    <p class="muted" style="margin-bottom:14px;font-size:.92rem;line-height:1.6">supabase does not keep automatic backups on this plan. one click pulls <b>everything</b> down as a json file: profiles, emails, posts, gigs, messages, follows, referrals, waitlist and 30 days of analytics. do it once a week and you can never lose the marketplace.</p>
    <div class="copybar"><button id="dlBackup">download a full backup</button><span class="muted" style="font-size:.8rem;align-self:center">${SEC.blocked_24h||0} spam attempts blocked in 24h</span></div>
  </div>

  <div class="grid2" style="margin-top:26px">
    <div class="panel" style="margin-top:0">
      <h3>what is happening right now 🛰️</h3>
      <div class="feed">
        ${(SEC.live||[]).map(e=>`<div class="fev"><span class="k ${esc2(e.kind)}">${esc2(e.kind)}</span><b>@${esc2(e.who)}</b><span class="w">${esc2(e.what)}</span><span class="t">${when(e.created_at)}</span></div>`).join('') || '<p class="muted">quiet so far</p>'}
      </div>
    </div>
    <div class="panel" style="margin-top:0">
      <h3>who is messaging the most, 24h 📣</h3>
      ${(SEC.top_senders||[]).map(t=>`<div class="tp"><span><b>@${esc2(t.username)}</b></span><span class="c">${t.msgs} msgs · ${t.new_chats} new</span></div>`).join('') || '<p class="muted">nobody yet</p>'}
      <h3 style="margin-top:26px">database locks 🔐</h3>
      <div class="rls">${(SEC.tables||[]).map(t=>`<span class="${t.rls&&t.pol>0?'':'bad'}">${esc2(t.t)} ${t.rls?'🔒':'⚠ open'}${t.pol?' · '+t.pol:''}</span>`).join('')}</div>
      <p class="muted" style="margin-top:10px;font-size:.8rem">every table should show 🔒. anything marked open means the public API can read it.</p>
    </div>
  </div>

  ${(SEC.banned||[]).length ? `<div class="panel">
    <h3>banned (${(SEC.banned||[]).length}) 🚫</h3>
    <table class="tbl"><thead><tr><th>user</th><th>reason</th><th>when</th><th></th></tr></thead><tbody>
    ${SEC.banned.map(b=>`<tr><td><b>@${esc2(b.username)}</b> ${esc2(b.name||'')}</td><td>${esc2(b.reason||'')}</td><td class="muted">${when(b.at)}</td>
      <td><div class="act"><button data-a="unban" data-t="${esc2(b.username)}">unban</button></div></td></tr>`).join('')}
    </tbody></table>
  </div>` : ''}

  ${(SEC.paid||[]).length ? `<div class="panel">
    <h3>paid perks running (${(SEC.paid||[]).length}) 💳</h3>
    <table class="tbl"><thead><tr><th>user</th><th>verified until</th><th>pinned until</th><th>agent until</th><th></th></tr></thead><tbody>
    ${SEC.paid.map(x=>`<tr><td><b>@${esc2(x.username)}</b></td>
      <td>${x.verified_until?esc2(String(x.verified_until).slice(0,10)):(x.verified?'no end date':'—')}</td>
      <td>${x.spotlight_until?when(x.spotlight_until):'—'}</td>
      <td>${x.agent_until?esc2(String(x.agent_until).slice(0,10)):'—'}</td>
      <td><div class="act"><button data-a="verify" data-t="${esc2(x.username)}" data-g="30">+30d verified</button><button data-a="pin_profile" data-t="${esc2(x.username)}" data-g="24">pin 24h</button></div></td></tr>`).join('')}
    </tbody></table>
  </div>` : ''}

  <div class="panel">
    <h3>the funnel, last 7 days 🧭</h3>
    <div class="funnel">
      <div class="fstep"><div class="fn">${s.visits_7d||0}</div><div class="fl">visited</div></div>
      <div class="fstep"><div class="fn">${s.signups_7d||0}</div><div class="fl">signed up</div><div class="fr">${pct(s.signups_7d, s.visits_7d)} of visits</div></div>
      <div class="fstep"><div class="fn">${s.new_profiles_7d||0}</div><div class="fl">finished profile</div><div class="fr">${pct(s.new_profiles_7d, s.signups_7d)} of signups</div></div>
      <div class="fstep"><div class="fn">${s.posts_24h||0}</div><div class="fl">posted · 24h</div></div>
      <div class="fstep"><div class="fn">${s.messages_24h||0}</div><div class="fl">messaged · 24h</div></div>
    </div>
    ${s.incomplete ? `<p class="muted" style="margin-top:14px"><b class="pill warn">${s.incomplete} stuck</b> &nbsp;accounts signed up but never finished the profile. that is your biggest leak.</p>` : ''}
  </div>

  <div class="grid2" style="margin-top:26px">
    <div class="panel" style="margin-top:0"><h3>visits, last 14 days 📈</h3><div class="bars">${bars}</div></div>
    <div class="panel" style="margin-top:0"><h3>top pages, 7 days 🔥</h3>${(s.top_pages||[]).map(p=>`<div class="tp"><span>${esc2(p.path)||'index'}</span><span class="c">${p.c}</span></div>`).join('') || '<p class="muted">no data yet</p>'}</div>
  </div>

  <div class="grid2b" style="margin-top:26px">
    <div class="panel" style="margin-top:0">
      <h3>most clicked, 7 days 👆</h3>
      ${clicks.length ? clicks.map(c=>`<div class="tp"><span>${esc2(c.ev)}</span><span class="c">${c.c}</span></div>`).join('')
        : '<p class="muted">no clicks tracked yet. this fills up as people use the site — it shows exactly which buttons get pressed and which get ignored.</p>'}
    </div>
    <div class="panel" style="margin-top:0">
      <h3>where they come from, 7 days 🌍</h3>
      ${(s.refs||[]).map(r=>`<div class="tp"><span>${esc2(r.ref)}</span><span class="c">${r.c}</span></div>`).join('') || '<p class="muted">no data yet</p>'}
    </div>
  </div>

  <div class="panel">
    <h3>everyone who signed up (${users.length}) 👤</h3>
    <div class="copybar">
      <button id="copyUsers">copy all emails</button>
      <button id="copyStuck">copy emails of stuck accounts</button>
    </div>
    <div class="scroll">
      <table class="tbl">
        <thead><tr><th>email</th><th>name</th><th>type</th><th>profile</th><th>joined</th><th>actions</th></tr></thead>
        <tbody>
        ${users.map(u=>`<tr>
          <td>${esc2(u.email)}</td>
          <td>${u.username?`<a href="profile.html?u=${encodeURIComponent(u.username)}" style="color:var(--cblue);font-weight:700">${esc2(u.name||u.username)}</a>`:'<span class="muted">—</span>'}</td>
          <td>${u.role?`<span class="pill ${u.role}">${u.role}</span>`:'<span class="pill none">no profile</span>'}</td>
          <td>${u.username?`${u.has_pic?'📷':'<span title="no picture">·</span>'} ${u.clips?u.clips+' clips':''}`:'<span class="pill warn">never finished</span>'}</td>
          <td class="muted">${esc2(u.joined)}</td>
          <td>${u.username?`<div class="act"><button data-a="verify" data-t="${esc2(u.username)}" data-g="30">verify 30d</button><button data-a="pin_profile" data-t="${esc2(u.username)}" data-g="24">pin 24h</button><button class="danger" data-a="ban" data-t="${esc2(u.username)}">ban</button></div>`:''}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h3>waitlist emails (${wl.length}) 🔔</h3>
    <div class="copybar"><button id="copyWl">copy all waitlist emails</button></div>
    <div class="scroll">
      <table class="tbl">
        <thead><tr><th>email</th><th>signed up</th></tr></thead>
        <tbody>${wl.map(w=>`<tr><td>${esc2(w.email)}</td><td class="muted">${esc2(w.at)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">nobody yet</td></tr>'}</tbody>
      </table>
    </div>
  </div>
`;

function copyList(arr, btn){
  const t=document.createElement('textarea'); t.value=arr.join(', '); document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); }catch(e){}
  t.remove();
  const old=btn.textContent; btn.textContent='copied '+arr.length+' ✓';
  setTimeout(()=>btn.textContent=old,1800);
}
document.getElementById('copyUsers')?.addEventListener('click', e=> copyList(users.map(u=>u.email).filter(Boolean), e.target));
document.getElementById('copyStuck')?.addEventListener('click', e=> copyList(users.filter(u=>!u.username).map(u=>u.email).filter(Boolean), e.target));
document.getElementById('copyWl')?.addEventListener('click', e=> copyList(wl.map(w=>w.email).filter(Boolean), e.target));

// ---- one click, everything on your disk ----
document.getElementById('dlBackup')?.addEventListener('click', async e=>{
  const b = e.target, old = b.textContent;
  b.textContent = 'pulling…';
  const { data: dump, error: de } = await sb.rpc('admin_export');
  if(de){ b.textContent = 'failed: ' + de.message.slice(0,40); return; }
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yougc-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  b.textContent = 'saved ✓  (' + Math.round(blob.size/1024) + ' KB)';
  setTimeout(()=>b.textContent = old, 4000);
});

// ---- control: run an admin action ----
async function run(action, target, arg){
  const out = document.getElementById('cOut');
  if(!action || !target){ out.className='cout bad'; out.textContent='needs an action and a target'; return; }
  target = String(target).trim().replace(/^@/,'');
  if(/^(ban|delete_user|delete_post|delete_gig)$/.test(action) && !confirm(action.replace('_',' ')+' "'+target+'" — sure?')) return;
  out.className='cout'; out.textContent='working…';
  const { data: r, error: e } = await sb.rpc('admin_do', { p_action: action, p_target: target, p_arg: arg ? String(arg) : null });
  if(e){ out.className='cout bad'; out.textContent = e.message; return; }
  out.className='cout ok'; out.textContent = action.replace('_',' ') + ' → @' + target + ' done ✓  (refreshing)';
  setTimeout(()=>location.reload(), 1100);
}
document.getElementById('cGo')?.addEventListener('click', ()=>
  run(document.getElementById('cAction').value, document.getElementById('cTarget').value, document.getElementById('cArg').value));
document.getElementById('cTarget')?.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('cGo').click(); });
box.addEventListener('click', async e=>{
  const b = e.target.closest('button[data-a],button[data-p]'); if(!b) return;
  if(b.dataset.a){ run(b.dataset.a, b.dataset.t, b.dataset.g || null); return; }
  const out = document.getElementById('cOut');
  b.disabled = true; b.textContent = '…';
  const { error: pe } = await sb.rpc('admin_payment_status', { p_id: Number(b.dataset.p), p_status: b.dataset.s });
  if(pe){ out.className='cout bad'; out.textContent = pe.message; b.disabled=false; return; }
  out.className='cout ok'; out.textContent = 'payment marked ' + b.dataset.s + ' ✓  (refreshing)';
  setTimeout(()=>location.reload(), 900);
});

// auto refresh every 60s so the tab is always current
setTimeout(()=>location.reload(), 60000);
document.getElementById('subline').innerHTML = 'live numbers from the marketplace · refreshes itself every minute · <span class="refresh" onclick="location.reload()">refresh now</span>';

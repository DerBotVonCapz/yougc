<!DOCTYPE html>
<html lang="en">
<head>

<style>
.pane.wide{max-width:1460px}
nav.top{padding-top:12px;padding-bottom:8px}
.pane{padding-top:6px}
.mt3{margin-top:18px !important}
.profGrid{display:grid;grid-template-columns:1fr 400px;gap:34px;align-items:start;margin-top:0}

.avatar.big{width:128px;height:128px}
#profileCard h1.page{font-size:clamp(2.1rem,4vw,3rem)}
#profileCard{padding:26px 38px 30px}
.pmeta{font-size:1rem}
#profileCard .ptags span{font-size:.92rem;padding:9px 20px}
.socialrow{gap:11px}
.socialrow a{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:14px}
.socialrow a svg{width:22px;height:22px}
#viewsBox .viewbox{margin-top:0;margin-bottom:22px}
aside h2.page{font-size:1.5rem !important}
#profileCard .vbadge{width:29px;height:29px;font-size:1rem}
#profileCard .btn{font-size:1rem;padding:15px 30px}
#profileCard .btn.small{font-size:.9rem;padding:13px 26px}
.sharebox{position:relative;overflow:hidden;margin-top:24px;padding:26px 28px 24px;border-radius:30px;
  border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(150deg,rgba(191,232,212,.44),rgba(191,215,242,.4) 55%,rgba(244,207,223,.4))}
html.dark .sharebox{background:linear-gradient(150deg,rgba(44,92,70,.4),rgba(46,74,115,.36) 55%,rgba(138,75,110,.3));border-color:rgba(255,255,255,.12)}
.sharebox::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.55);
  filter:blur(66px);top:-120px;right:-90px;animation:upfl 9s ease-in-out infinite alternate}
.sharebox>*{position:relative}
.shead{text-align:center;margin-bottom:22px}
.skick{font-size:.66rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.shead h3{margin-top:7px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.04em;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.sgrid{grid-template-columns:1fr}.sharebox{padding:26px 20px 24px}}
.scard{padding:20px 20px 18px;border-radius:22px;background:rgba(255,255,255,.93);
  box-shadow:0 16px 38px -24px rgba(46,74,115,.5);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
html.dark .scard{background:rgba(20,28,46,.94)}
.scard:hover{transform:translateY(-5px)}
.sn{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.82rem;background:linear-gradient(135deg,#BFD7F2,#F4CFDF);color:#2E4A73;margin-bottom:11px}
.scard:nth-child(2) .sn{background:linear-gradient(135deg,#F7D9C4,#F4CFDF);color:#8A4B2E}
.scard:nth-child(3) .sn{background:linear-gradient(135deg,#C8E6D4,#BFD7F2);color:#245C42}
.st{font-weight:800;font-size:1.02rem;letter-spacing:-.02em}
.st b{background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sd{margin-top:5px;font-size:.86rem;line-height:1.5;color:var(--ink-soft);font-weight:600}
.sd b{color:var(--ink);font-weight:800}
.srow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.srow input{flex:1;min-width:180px;margin:0;font-size:.88rem;font-weight:600}
.srow .btn{white-space:nowrap}
.refcount{margin-top:12px;font-size:.85rem;font-weight:700;color:var(--ink)}
h2.page{font-size:1.7rem !important;margin-top:4px}
.post .ptext{font-size:1rem}
.clipgrid{display:flex;gap:16px;margin-top:20px;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x proximity}
.clipgrid::-webkit-scrollbar{height:7px}
.clipgrid::-webkit-scrollbar-thumb{background:rgba(30,51,80,.18);border-radius:99px}
.clipgrid::-webkit-scrollbar-track{background:transparent}
.clip{flex:0 0 auto;height:224px;border-radius:22px;overflow:hidden;scroll-snap-align:start;border:2.5px solid transparent;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4) border-box;
  box-shadow:0 16px 36px -18px rgba(46,74,115,.4);
  transition:transform .3s,box-shadow .3s;will-change:transform;
  animation:clipfloat 6s ease-in-out infinite alternate}
.clip:nth-child(2){animation-delay:.9s;animation-duration:7.1s}
.clip:nth-child(3){animation-delay:1.7s;animation-duration:6.4s}
@keyframes clipfloat{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.clip:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 26px 54px -20px rgba(110,150,200,.65);animation-play-state:paused;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,linear-gradient(120deg,#6E96C8,#D98BB0,#E8926B) border-box}
.clip iframe{display:block;height:100%;border:0}
.clip.tall iframe{width:151px}
.clip.wide iframe{width:476px}

/* ---- owner actions + paid perks ---- */
.ownerrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px;padding-top:22px;border-top:1.5px solid rgba(30,51,80,.09)}
.upsell{margin-top:28px;padding:28px 30px 26px;border-radius:34px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(191,215,242,.46),rgba(244,207,223,.36) 52%,rgba(191,232,212,.44));
  border:2px solid rgba(255,255,255,.9)}
.upsell::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(70px);top:-130px;right:-100px;animation:upfl 9s ease-in-out infinite alternate}
@keyframes upfl{from{transform:translate(0,0)}to{transform:translate(-44px,44px)}}
.uphead{position:relative;text-align:center;margin-bottom:20px}
.upkick{font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#5A6A85}
.uphead h3{font-size:clamp(1.35rem,2.3vw,1.8rem);font-weight:800;letter-spacing:-.03em;margin-top:6px;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.upsub{margin-top:9px;font-size:.98rem;font-weight:600;color:var(--ink-soft)}
.upgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
@media(max-width:880px){.upgrid{grid-template-columns:1fr}.upsell{padding:34px 22px 30px}}
.upcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:13px;
  padding:30px 26px 26px;border-radius:26px;background:rgba(255,255,255,.95);text-decoration:none;color:inherit;
  box-shadow:0 20px 44px -24px rgba(46,74,115,.5);overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.upcard::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);
  transform:translateX(-130%);transition:transform .75s ease}
.upcard:hover::after{transform:translateX(130%)}
.upcard:hover{transform:translateY(-8px);box-shadow:0 34px 66px -24px rgba(110,150,200,.75)}
.upic{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#BFD7F2,#F4CFDF);color:#2E4A73;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.upic svg{width:27px;height:27px}
.upcard:hover .upic{transform:rotate(-8deg) scale(1.09)}
.upcard.c2 .upic{background:linear-gradient(135deg,#F7D9C4,#F4CFDF);color:#8A4B2E}
.upcard.c3 .upic{background:linear-gradient(135deg,#C8E6D4,#BFD7F2);color:#245C42}
.upt{font-weight:800;font-size:1.22rem;letter-spacing:-.025em}
.uphook{font-size:1rem;line-height:1.5;font-weight:600;color:var(--ink)}
.uphook b{font-weight:800;background:linear-gradient(90deg,#2E4A73,#6E96C8);-webkit-background-clip:text;background-clip:text;color:transparent}
.upcard.c2 .uphook b{background:linear-gradient(90deg,#C4703F,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.upcard.c3 .uphook b{background:linear-gradient(90deg,#2F7A57,#6E96C8);-webkit-background-clip:text;background-clip:text;color:transparent}
.upl{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.855rem;color:var(--ink-soft);font-weight:600;margin:0;padding:0}
.upl li{display:flex;gap:8px;align-items:flex-start}
.upl li::before{content:'✓';color:#3E9068;font-weight:800;flex:none}
.uprow{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:11px;width:100%;flex-wrap:wrap}
.upbtn{font-weight:800;font-size:.95rem;color:#fff;padding:12px 24px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(120deg,#2E4A73,#6E96C8,#D98BB0);background-size:200% 100%;
  box-shadow:0 12px 26px -12px rgba(110,150,200,.8);transition:background-position .5s}
.upcard:hover .upbtn{background-position:100% 0}
.upnote{font-size:.75rem;color:var(--ink-soft);font-weight:700}
.uptag{position:absolute;top:14px;right:14px;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  padding:5px 10px;border-radius:999px;background:linear-gradient(120deg,#2E4A73,#6E96C8);color:#fff;z-index:2;box-shadow:0 6px 14px -6px rgba(46,74,115,.6)}
.upcard .upic{margin-top:6px}
.upcard.owned{cursor:default}
.upcard.owned:hover{transform:none;box-shadow:0 20px 44px -24px rgba(46,74,115,.5)}
.upcard.owned::after{display:none}
.upbtn.done{background:linear-gradient(120deg,#5FB78B,#BFE8D4);color:#14361F}
html.dark .upcard{background:rgba(20,28,46,.94)}
html.dark .upsell{background:linear-gradient(150deg,rgba(46,74,115,.42),rgba(138,75,110,.32) 52%,rgba(44,92,70,.36));border-color:rgba(255,255,255,.12)}
html.dark .ownerrow{border-top-color:rgba(255,255,255,.1)}

/* ---- profile views (owner only) ---- */
.viewbox{margin-top:30px;padding:20px 22px 18px;border-radius:22px;position:relative;overflow:hidden;
  background:rgba(191,215,242,.26);border:1.5px solid rgba(46,74,115,.1);color:var(--ink)}
html.dark .viewbox{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.vhead{position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vkick{font-size:.64rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.vrow{position:relative;display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.vstat .vn{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums}
.vstat .vl{font-size:.72rem;font-weight:600;color:var(--ink-soft);margin-top:4px}
.vbars{position:relative;display:flex;align-items:flex-end;gap:5px;height:36px;margin-top:14px}
.vbars i{flex:1;border-radius:4px 4px 2px 2px;background:rgba(46,74,115,.28);min-height:3px;display:block}
html.dark .vbars i{background:rgba(255,255,255,.3)}
.vnote{position:relative;font-size:.8rem;color:var(--ink-soft);margin-top:12px;line-height:1.5;font-weight:600}
</style>
</head>

<script type="module">

import { VERIFIED_PRICE, PIN_PRICE, AGENT_PRICE } from './config.js';

const IC_VERIFIED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.4l2.4 2.1 3.2-.3.9 3.1 2.6 1.9-1.4 2.9 1.4 2.9-2.6 1.9-.9 3.1-3.2-.3L12 21.6l-2.4-2.1-3.2.3-.9-3.1L2.9 15l1.4-2.9L2.9 9.2l2.6-1.9.9-3.1 3.2.3z"/><path d="M8.6 12.2l2.3 2.3 4.5-4.6"/></svg>';

const IC_AGENT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2.2l1.85 5.35L18.2 9.4l-5.35 1.85L11 16.6l-1.85-5.35L3.8 9.4l5.35-1.85z"/><path d="M18.3 13.6l.85 2.45 2.45.85-2.45.85-.85 2.45-.85-2.45-2.45-.85 2.45-.85z" opacity=".6"/></svg>';
const SOC_ICONS = {
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.43.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.43.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.43-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.43-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.38C1.35 2.68.94 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.13.67.66 1.34 1.07 2.13 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.38.66-.67 1.07-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.31-.79-.72-1.46-1.38-2.13-.67-.66-1.34-1.07-2.13-1.38-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.4a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.6 5.82a4.28 4.28 0 0 1-1.05-2.82h-3.2v12.86a2.59 2.59 0 0 1-2.59 2.53 2.59 2.59 0 0 1-2.59-2.59 2.59 2.59 0 0 1 3.4-2.46V9.9a5.78 5.78 0 0 0-.81-.06A5.78 5.78 0 0 0 4 15.62a5.78 5.78 0 0 0 9.86 4.09 5.78 5.78 0 0 0 1.7-4.1V8.9a7.44 7.44 0 0 0 4.34 1.39V7.1a4.28 4.28 0 0 1-3.3-1.28z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23 12s0-3.8-.48-5.6a2.9 2.9 0 0 0-2.05-2.05C18.67 3.87 12 3.87 12 3.87s-6.67 0-8.47.48A2.9 2.9 0 0 0 1.48 6.4C1 8.2 1 12 1 12s0 3.8.48 5.6a2.9 2.9 0 0 0 2.05 2.05c1.8.48 8.47.48 8.47.48s6.67 0 8.47-.48a2.9 2.9 0 0 0 2.05-2.05C23 15.8 23 12 23 12zM9.75 15.5v-7l6.05 3.5z"/></svg>',
  telegram:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.94 4.3 18.6 20c-.24 1.09-.9 1.35-1.82.84l-5.03-3.7-2.43 2.34c-.27.27-.5.5-1.01.5l.36-5.13 9.34-8.44c.4-.36-.09-.56-.63-.2L5.83 13.2 0.86 11.65c-1.08-.34-1.1-1.08.23-1.6L20.5 2.7c.9-.33 1.69.2 1.44 1.6z"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.7 2.8 2.7 15.6 0 18.4M12 2.8c-2.7 2.8-2.7 15.6 0 18.4"/></svg>'
};
const ACCENTS = { blue:['#BFD7F2','#DCE9F9'], pink:['#F4CFDF','#FBE3EE'], mint:['#BFE8D4','#DFF2E7'], lavender:['#D8CCF2','#EAE3F9'], peach:['#F8D8C4','#FBEBDD'], sand:['#EFE3C6','#F7F0DE'], coral:['#FBC9C2','#FDE2DE'], sky:['#BEE6F5','#DCF2FA'], lime:['#DCEFB8','#EDF7DB'], grape:['#CFC3EE','#E4DDF7'], rose:['#F6C6D8','#FBE0EA'], sunset:['#FBD3A8','#FDE9CE'], ocean:['#B6DCE0','#D9EFF1'], berry:['#E7C2E4','#F3DEF2'], slate:['#CBD5E6','#E3E9F3'] };
const payHref = (perk, item, price) => 'pay.html?perk=' + perk + '&item=' + encodeURIComponent(item) + '&price=' + encodeURIComponent(price);
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const _q = new URLSearchParams(location.search);
const username = _q.get('u');
// someone landed here through a referral link: remember who sent them
try{
  const _r = (_q.get('ref')||'').replace(/^@/,'').replace(/[^a-zA-Z0-9_.-]/g,'').slice(0,40);
  if(_r) localStorage.setItem('yougc_ref', _r);
}catch(e){}
const card = document.getElementById('profileCard');
const { data: p } = await sb.from('profiles').select('*').eq('username', username).maybeSingle();

if(!p){
  card.innerHTML = '<p class="muted center">profile not found.</p>';
} else {
  p.name = p.name || p.username || 'creator';
  document.title = p.name + ' · ' + (p.role === 'brand' ? 'brand' : 'ugc creator') + ' on YOUgc';
  const md = document.querySelector('meta[name=description]');
  if(md) md.content = (p.bio || (p.name + ' on YOUgc')).slice(0,155);
  const u = await currentUser();
  const isOwner = !!(u && u.id === p.id);
  // count this as a profile view (not the owner looking at their own page)
  try{ if(!isOwner) track('view:@' + p.username); }catch(e){}
  const ac = ACCENTS[p.accent] || ACCENTS.blue;
  card.style.background = isDark()
    ? `radial-gradient(circle at 18% 12%, ${ac[0]}30, transparent 58%), radial-gradient(circle at 88% 85%, ${ac[1]}28, transparent 55%), rgba(18,26,44,.88)`
    : `radial-gradient(circle at 18% 12%, ${ac[0]}B3, transparent 58%), radial-gradient(circle at 88% 85%, ${ac[1]}A6, transparent 55%), radial-gradient(circle at 60% 40%, ${ac[0]}40, transparent 60%), rgba(255,255,255,.8)`;
  const joined = new Date(p.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}).toLowerCase();
  const { count: followers } = await sb.from('follows').select('*',{count:'exact',head:true}).eq('followed', p.id);
  const folTotal = (followers||0) + (p.follower_boost||0);
  let iFollow = false;
  if(u && !isOwner){
    const { data: f } = await sb.from('follows').select('follower').eq('follower', u.id).eq('followed', p.id).maybeSingle();
    iFollow = !!f;
  }
  const socials = SOCIAL_FIELDS
    .filter(f => p.socials && safeUrl(p.socials[f.key]))
    .map(f => `<a href="${esc(safeUrl(p.socials[f.key]))}" target="_blank" rel="noopener" aria-label="${f.label}" title="${f.label}">${SOC_ICONS[f.key]||esc(f.label)}</a>`)
    .join('');
  card.innerHTML = `
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      ${avatarHTML(p, true)}
      <div style="flex:1;min-width:200px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h1 class="page" style="margin:0">${esc(p.name)}</h1>${vbadge(p)}
          <span class="rolebadge ${p.role}">${p.role==='creator'?'creator':'brand'}</span>
        </div>
        <div class="pmeta">@${esc(p.username)} · <span id="folCount">${folTotal}</span> followers · joined ${joined}</div>
      </div>
    </div>
    ${p.bio ? `<p class="mt2" style="line-height:1.75;font-size:1.18rem;font-weight:500">${esc(p.bio)}</p>` : ''}
    <div id="clipsWrap"></div>
    <div class="ptags mt2">${(p.niches||[]).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
    ${socials ? `<div class="socialrow">${socials}</div>` : ''}
    ${!isOwner ? (u ? `<div class="mt3" style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" id="contact" href="chat.html?u=${encodeURIComponent(p.username)}">message ${esc(p.name.split(' ')[0])} →</a><button class="btn ghost" id="followBtn">${iFollow?'following ✓':'+ follow'}</button></div>` : `<a class="btn mt3" id="contact" href="auth.html">log in to message ${esc(p.name.split(' ')[0])} →</a>`) : ''}
    ${isOwner ? `<div class="ownerrow"><a class="btn" href="onboard.html">edit profile →</a><a class="btn ghost" href="settings.html">settings</a>${(p.agent_until && new Date(p.agent_until)>new Date()) ? `<a class="btn" style="background:linear-gradient(120deg,#6E96C8,#D98BB0);color:#fff" href="agent.html">my agent ✨</a>` : ``}</div>` : ''}`;

  if(isOwner) document.getElementById('profileExtras').innerHTML = `
    <div class="upsell">
      <div class="uphead"><span class="upkick">grow faster</span><h3>three ways to get picked first.</h3>
        <div class="upsub">brands scroll fast. these decide whether they stop on you.</div></div>
      <div class="upgrid">
        ${isVerified(p)?`<div class="upcard owned"><span class="upic">${IC_VERIFIED}</span><div class="upt">verified</div>
          <div class="uphook">running right now. brands see the badge.</div>
          <div class="uprow"><span class="upbtn done">active ✓</span><span class="upnote">until ${p.verified_until?new Date(p.verified_until).toLocaleDateString():'you cancel'}</span></div></div>`
        :`<a class="upcard" data-ev="perk:verified" href="${payHref('verified','verified pack @'+p.username, VERIFIED_PRICE)}"><span class="uptag">most picked</span><span class="upic">${IC_VERIFIED}</span><div class="upt">verified</div>
          <div class="uphook">the badge brands look for.</div>
          <ul class="upl"><li>the ✓ on your name</li><li>your posts pushed higher</li><li>top of the marketplace</li><li>3 posts a day, first pin free</li></ul>
          <div class="uprow"><span class="upbtn">$${VERIFIED_PRICE} / month</span><span class="upnote">cancel any time</span></div></a>`}

        ${(p.spotlight_until && new Date(p.spotlight_until)>new Date())?`<div class="upcard c2 owned"><span class="upic">${IC_PIN}</span><div class="upt">profile pin</div>
          <div class="uphook">your profile is on top of the marketplace.</div>
          <div class="uprow"><span class="upbtn done">running ✓</span><span class="upnote">ends ${new Date(p.spotlight_until).toLocaleString([], {hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span></div></div>`
        :`<a class="upcard c2" data-ev="perk:pin_profile" href="${payHref('pin_profile','profile pin @'+p.username, PIN_PRICE)}"><span class="upic">${IC_PIN}</span><div class="upt">profile pin</div>
          <div class="uphook">24 hours on top of the marketplace.</div>
          <ul class="upl"><li>your card, first row</li><li>only a few slots at once</li></ul>
          <div class="uprow"><span class="upbtn">$${PIN_PRICE} once</span><span class="upnote">24 hours</span></div></a>`}

        ${(p.agent_until && new Date(p.agent_until)>new Date())?`<div class="upcard c3 owned"><span class="upic">${IC_AGENT}</span><div class="upt">agent</div>
          <div class="uphook">your agent is awake.</div>
          <div class="uprow"><a class="upbtn done" href="agent.html">open it →</a><span class="upnote">until ${new Date(p.agent_until).toLocaleDateString()}</span></div></div>`
        :`<a class="upcard c3" data-ev="perk:agent" href="${payHref('agent',(p.role==='brand'?'brand':'creator')+' agent @'+p.username, AGENT_PRICE)}"><span class="upic">${IC_AGENT}</span><div class="upt">agent</div>
          <div class="uphook">your profile, fixed as you go.</div>
          <ul class="upl"><li>fixes your bio and photo</li><li>writes posts brands stop on</li><li>tells you what to charge</li></ul>
          <div class="uprow"><span class="upbtn">$${AGENT_PRICE} / month</span><span class="upnote">cancel any time</span></div></a>`}
      </div>
    </div>
    <div class="sharebox">
      <div class="shead"><span class="skick">bring people in</span><h3>your link, your discount.</h3></div>
      <div class="sgrid">
        <div class="scard">
          <div class="sn">1</div>
          <div class="st">share your link</div>
          <div class="sd">it opens straight on your profile, with your photo and clips.</div>
        </div>
        <div class="scard">
          <div class="sn">2</div>
          <div class="st">they get <b>10% off</b></div>
          <div class="sd">code <b>YOUGC10</b> at checkout, on anything they buy.</div>
        </div>
        <div class="scard">
          <div class="sn">3</div>
          <div class="st">you get <b>10% off</b></div>
          <div class="sd">once they join, your next perk is 10% off too.</div>
        </div>
      </div>
      <div class="srow">
        <input type="text" id="refLink" readonly>
        <button class="btn" id="refCopy">copy my link</button>
      </div>
      <div class="refcount" id="refCount"></div>
    </div>`;

  // best clips (creators)
  const embeds = (p.clips||[]).map(clipEmbed).filter(Boolean);
  if(embeds.length){
    document.getElementById('clipsWrap').innerHTML =
      '<div class="clipgrid">' + embeds.map(e=>
        `<div class="clip ${e.tall?'tall':'wide'}"><iframe src="${esc(e.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`
      ).join('') + '</div>';
  }

  const fb = document.getElementById('followBtn');
  if(fb){
    fb.addEventListener('click', async ()=>{
      if(fb.textContent.includes('following')){
        await sb.from('follows').delete().eq('follower', u.id).eq('followed', p.id);
        fb.textContent = '+ follow';
        document.getElementById('folCount').textContent = Math.max(0, parseInt(document.getElementById('folCount').textContent)-1);
      } else {
        const { error } = await sb.from('follows').insert({ follower: u.id, followed: p.id });
        if(!error){
          fb.textContent = 'following ✓';
          document.getElementById('folCount').textContent = parseInt(document.getElementById('folCount').textContent)+1;
        }
      }
    });
  }

  if(isOwner){
    const refUrl = location.origin + '/u/' + encodeURIComponent(p.username) + '?ref=' + encodeURIComponent(p.username);
  
  // ---- profile views (owner only) ----
  if(isOwner){
    sb.rpc('my_profile_views').then(({data})=>{
      const box = document.getElementById('viewsBox');
      if(!box || !data) return;
      const daily = data.daily || [];
      const max = Math.max(1, ...daily.map(d=>d.c));
      const bars = daily.length
        ? daily.map(d=>`<i style="height:${Math.round(d.c/max*32)+3}px" title="${d.d}: ${d.c}"></i>`).join('')
        : '';
      box.innerHTML = `
        <div class="viewbox">
          <div class="vhead"><span class="vkick">your profile</span></div>
          <div class="vrow">
            <div class="vstat"><div class="vn">${data.d1||0}</div><div class="vl">views today</div></div>
            <div class="vstat"><div class="vn">${data.d7||0}</div><div class="vl">views this week</div></div>
            <div class="vstat"><div class="vn">${data.total||0}</div><div class="vl">views all time</div></div>
          </div>
          ${bars?`<div class="vbars">${bars}</div>`:''}
        </div>`;
    });
  }
  document.getElementById('refLink').value = refUrl;
    document.getElementById('refCopy').addEventListener('click', async ()=>{
      const b = document.getElementById('refCopy');
      try{ track('profile·share'); }catch(e){}
      if(navigator.share){ try{ await navigator.share({ title: p.name + ' on YOUgc', url: refUrl }); }catch(e){} }
      try{ await navigator.clipboard.writeText(refUrl); }
      catch(e){ const i=document.getElementById('refLink'); i.select(); document.execCommand('copy'); }
      b.textContent='copied ✓';
      setTimeout(()=>b.textContent='copy my link',1800);
    });
    sb.from('referrals').select('id',{count:'exact',head:true}).eq('referrer_username', p.username)
      .then(({count})=>{ if(count) document.getElementById('refCount').textContent = count + (count===1?' friend joined':' friends joined') + ' through your link'; });
    sb.from('referrals').select('referrer_username').eq('referred', p.id).maybeSingle()
      .then(({data})=>{ if(data){ const el=document.getElementById('refCount'); el.textContent += (el.textContent?' · ':'') + 'you joined via @' + data.referrer_username + '. 10% off your next purchase locked in'; } });
  }

  const { data: posts } = await sb.from('posts').select('id,text,img,created_at').eq('user_id', p.id).order('created_at',{ascending:false}).limit(10);
  const wrap = document.getElementById('posts');
  wrap.innerHTML = (posts&&posts.length)
    ? posts.map(x=>`<div class="card post"><div class="pmeta" style="margin-bottom:8px">${timeAgo(x.created_at)}</div><div class="ptext">${esc(x.text)}</div>${safeUrl(x.img)?`<a href="${esc(safeUrl(x.img))}" target="_blank" rel="noopener"><img src="${esc(safeUrl(x.img))}" style="max-width:100%;max-height:340px;border-radius:14px;margin-top:12px;display:block;object-fit:cover" loading="lazy"></a>`:''}</div>`).join('')
    : '<div class="card"><p class="muted center">no posts yet.</p></div>';
}
</script>
<script type="module" src="i18n.js"></script>
<script src="cursor.js?v=4" defer></script>
</body>
</html>

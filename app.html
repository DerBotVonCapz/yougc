<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marketplace · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .floatlogo{position:fixed;z-index:60;opacity:.9;user-select:none;pointer-events:none;will-change:transform;left:0;top:0}
  @media(max-width:760px){.floatlogo{display:none}}
  .floatlogo img{height:56px;display:block}
  .prep{text-align:center;padding:3.4vh 0 4vh;max-width:100% !important}
  .prep .big{position:relative;display:inline-block;font-family:'Space Grotesk','Poppins',sans-serif;font-weight:700;letter-spacing:-.045em;line-height:.98;
    font-size:clamp(3rem,9.2vw,8.4rem);white-space:nowrap;
    background:linear-gradient(95deg,#2E4A73 0%,#6E96C8 22%,#D98BB0 46%,#E8926B 64%,#6E96C8 84%,#2E4A73 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:bigsweep 8s linear infinite, bigfloat 6s ease-in-out infinite alternate;
    filter:drop-shadow(0 22px 30px rgba(46,74,115,.32));
    will-change:background-position,transform}
  @keyframes bigsweep{from{background-position:0% 0}to{background-position:220% 0}}
  @keyframes bigfloat{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
  .prep .big2{font-family:'Space Grotesk','Poppins',sans-serif;font-weight:700;letter-spacing:-.04em;line-height:1;
    font-size:clamp(1.6rem,4.6vw,3.9rem);color:var(--ink);margin-top:16px}
  .prep .dots span{display:inline-block;animation:blink 1.4s infinite}
  .prep .dots span:nth-child(2){animation-delay:.2s}
  .prep .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
  .prep .sub{margin:40px auto 0;max-width:780px;font-size:clamp(1.15rem,2.1vw,1.55rem);font-weight:700;line-height:1.7;color:var(--ink)}
  .prep .sub .grad2{background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .prepcards{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:1060px;margin:46px auto 0;text-align:left;align-items:stretch}
  @media(max-width:860px){.prepcards{grid-template-columns:1fr}}
  .prepcards .card{border-radius:32px;padding:26px 32px;background:rgba(255,255,255,.78);box-shadow:0 24px 60px -30px rgba(46,74,115,.28);margin:0}
  .prepcards .card .ptitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:-.02em;margin-bottom:6px}
  .prepcards .card .psub{font-size:.98rem;color:var(--ink-soft);line-height:1.7;margin-bottom:16px}
  .prepcards input[type=email],.prepcards input[type=text]{font-size:1rem;padding:15px 18px}
  .prepcards .refbox{margin:0;padding:0;background:none;box-shadow:none;border:none;border-radius:0}
  .prepcards .refbox .rtitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:-.02em;text-transform:none;color:var(--ink);margin-bottom:6px}
  .prepcards .refbox .rsub{font-size:.98rem;line-height:1.7;margin-bottom:16px}
  .prepmarq{margin:calc(2vh + 40px) 0 0;overflow:hidden;white-space:nowrap;padding:12px 0}
  .prepmarq .ptrack{display:inline-block;animation:pscroll 36s linear infinite;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:1.7rem;color:rgba(30,51,80,.16)}
  .prepmarq .ptrack b{color:rgba(110,150,200,.45);font-weight:700}
  @keyframes logosheen{from{background-position:-160% 0,0 0}to{background-position:260% 0,0 0}}
  .mainGrid{grid-template-columns:1fr 380px !important;gap:34px !important}
  @media(max-width:920px){.mainGrid{grid-template-columns:1fr !important;gap:20px !important}.sideCol{position:static}}
  .mainGrid.wide{grid-template-columns:1fr !important}
  .mainGrid.wide .sideCol{display:none}
  /* people marketplace grid */
    .pplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px;margin-top:4px}
  /* posts as a wide multi column grid */
  .postgrid{column-count:2;column-gap:20px;margin-top:4px}
  @media(min-width:1750px){.postgrid{column-count:3}}
  @media(max-width:860px){.postgrid{column-count:1}}
  .postgrid .post{break-inside:avoid;margin:0 0 20px;padding:24px 22px;display:inline-block;width:100%}
  .postgrid .phead{gap:12px}
  .postgrid .avatar{width:46px;height:46px}
  .postgrid .pname{font-size:.98rem !important}
  .postgrid .pmeta{font-size:.74rem}
  .postgrid .ptext{font-size:.98rem !important}
  /* toolbar */
  .mtools{display:flex;flex-direction:column;gap:14px;margin:6px 0 24px}
  .mtoprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .mtoprow #searchInp{flex:1;min-width:260px;margin:0 !important}
  .mtools .tabs.main{margin:0 !important;flex-shrink:0}
  .mtools #filterChips{margin:0 !important}
  .pcard{border-radius:26px;padding:28px 20px 24px;text-align:center;border:2.5px solid transparent;
    background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.85)) padding-box,
               linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4,#BFD7F2) border-box;
    box-shadow:0 18px 44px -24px rgba(46,74,115,.35);transition:transform .25s,box-shadow .25s;
    display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;min-width:0}
  .pcard:hover{transform:translateY(-6px);box-shadow:0 30px 60px -24px rgba(110,150,200,.55)}
  .pcard .avatar{width:84px;height:84px;font-size:1.6rem}
  .pcname{font-weight:800;font-size:1.1rem;margin-top:14px;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcuser{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
  .pcbio{font-size:.84rem;color:var(--ink-soft);line-height:1.55;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .pcchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
  .pcchips span{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(191,215,242,.38);color:var(--ink)}
  .pcstat{font-size:.75rem;font-weight:600;color:var(--ink-soft);margin-top:10px}
  .pcbtn{margin-top:14px;font-weight:700;font-size:.86rem;color:#fff;background:linear-gradient(120deg,#6E96C8,#D98BB0);padding:10px 24px;border-radius:999px;box-shadow:0 12px 26px -12px rgba(110,150,200,.7)}
  html.dark .pcard{background:linear-gradient(rgba(23,31,52,.92),rgba(23,31,52,.92)) padding-box,
    linear-gradient(120deg,#2E4A73,#8A4B6E,#2C5C46,#2E4A73) border-box}
  html.dark .pcchips span{background:rgba(110,150,200,.2)}
  #composer textarea{min-height:230px;font-size:1rem}
  #composer{padding:34px}
  #composer label{font-size:.85rem}
  .tabs.main{gap:10px;margin:16px 0 14px}
  .tabs.main .tab{font-size:1rem;font-weight:700;padding:13px 30px}
  .tabs.main .tab.on{background:linear-gradient(120deg,#2E4A73,#6E96C8);border-color:transparent;box-shadow:0 10px 24px -10px rgba(46,74,115,.5)}
  .tabs.roletabs{gap:8px;margin:0 0 14px}
  .rtab{padding:8px 20px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.6);border:1.5px solid rgba(30,51,80,.1);color:var(--ink-soft);transition:all .2s}
  .rtab:hover{transform:translateY(-2px)}
  .rtab.on{background:linear-gradient(120deg,#F4CFDF,#BFD7F2);color:var(--ink);border-color:transparent;font-weight:700}
  .post{padding:34px}
  .postimg{max-width:100%;max-height:440px;border-radius:16px;margin-top:14px;display:block;object-fit:cover}
  .ptext{font-size:1rem !important;line-height:1.7 !important}
  .pname{font-size:1.05rem !important}
  .avatar{width:56px;height:56px}
  .spotrow{gap:14px !important;margin-bottom:26px !important}
  #searchInp{padding:19px 26px;font-size:1.05rem;border-radius:999px;box-shadow:0 16px 36px -22px rgba(46,74,115,.4)}
  .mfbtn{position:fixed;right:26px;bottom:26px;z-index:80;border:none;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:800;font-size:.95rem;padding:16px 26px;border-radius:999px;background:linear-gradient(120deg,#6E96C8,#D98BB0);color:#fff;box-shadow:0 18px 40px -14px rgba(110,150,200,.75);transition:transform .25s}
  .mfbtn:hover{transform:translateY(-3px) scale(1.04)}
  .mfpanel{position:fixed;right:26px;bottom:94px;z-index:81;width:min(94vw,430px);height:min(72vh,620px);display:none;flex-direction:column;overflow:hidden;border-radius:24px;padding:0}
  .mfpanel.open{display:flex}
  .mfhead{padding:16px 20px;font-weight:800;border-bottom:1.5px solid rgba(30,51,80,.08);display:flex;justify-content:space-between;align-items:center}
  .mfhead .x{cursor:pointer;font-weight:700;color:var(--ink-soft);padding:2px 8px}
  .mflog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .mfb{max-width:90%;padding:11px 15px;border-radius:16px;font-size:.88rem;line-height:1.6;animation:bubIn .25s ease}
  @keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .mfb.user{align-self:flex-end;background:linear-gradient(120deg,#2E4A73,#48688F);color:#fff;border-bottom-right-radius:6px}
  .mfb.bot{align-self:flex-start;background:rgba(255,255,255,.92);border:1.5px solid rgba(30,51,80,.08);border-bottom-left-radius:6px;width:88%}
  .mfcard{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(191,215,242,.3);margin-top:8px;text-decoration:none;color:var(--ink);transition:transform .2s}
  .mfcard:hover{transform:translateY(-2px)}
  .mfcard .avatar{width:40px;height:40px}
  .mfcard .mfn{font-weight:700;font-size:.85rem;display:flex;align-items:center}
  .mfcard .mfr{font-size:.72rem;color:var(--ink-soft);margin-top:2px}
  .mfbar{display:flex;gap:8px;padding:12px 14px;border-top:1.5px solid rgba(30,51,80,.08)}
  .mfbar input{flex:1}
  @keyframes pscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="chat.html" id="notifNav" style="display:none">🔔</a>
      <a class="nav-cta" href="chat.html" id="chatNav">chats</a>
      <a class="nav-cta" id="mypage" href="#">my profile</a>
    </div>
  </nav>

  <div class="appwrap" id="appwrap">
    <h1 class="page big">market<span class="grad">place</span></h1>

    <div class="mainGrid" id="mainGrid">
      <div>
        <div id="spotrow"></div>

        <div class="mtools">
          <div class="mtoprow">
            <input type="text" id="searchInp" placeholder="🔎 search creators and brands…" autocomplete="off">
            <div class="tabs main">
              <span class="tab on" data-tab="creators">🎬 creators</span>
              <span class="tab" data-tab="brands">🛍️ brands</span>
              <span class="tab" data-tab="posts">📣 posts</span>
            </div>
          </div>
          <div class="chips" id="filterChips"></div>
        </div>
        <div id="searchRes"></div>

        <div id="feed"><p class="muted center mt3">loading…</p></div>
      </div>

      <aside class="sideCol">
        <div class="card" id="composer" style="display:none">
          <label style="margin-top:0">your post</label>
          <textarea id="postText" maxlength="500" placeholder=""></textarea>
          <input type="file" id="postImg" accept="image/*" style="display:none">
          <button class="btn ghost small full mt1" id="postImgBtn">📷 add a picture</button>
          <button class="btn small full mt1" id="postBtn">post</button>
          <a class="btn ghost small full mt1" id="featLink" href="#" style="border-color:rgba(30,51,80,.3);white-space:nowrap;font-size:.8rem;padding-left:8px;padding-right:8px;display:flex;align-items:center;justify-content:center;gap:6px"><span>feature your post · 24h on top · $<span id="featPrice">25</span></span><span>🔥</span></a>
          <div class="msg" id="postMsg"></div>
        </div>
        <a class="card" href="studio.html" style="display:block;text-decoration:none;color:inherit;margin-top:18px">
          <div style="font-weight:800;font-size:1.08rem">🎬 YOUgc studio</div>
          <p class="muted" style="margin-top:8px;font-size:.88rem;line-height:1.6">got a deal running? we jump in with hooks, scripts and edits so the video actually hits. studio pass plus a small share per video.</p>
          <span style="display:inline-block;margin-top:10px;font-weight:700;font-size:.88rem;background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent">see how it works →</span>
        </a>
      </aside>
    </div>
  </div>
</div>

<script type="module">
import { sb, requireAuth, NICHES, blobsHTML, initMotion, logoHTML, esc, timeAgo, avatarHTML, vbadge, isVerified, hasSlurs, hasBadLinks, showMsg } from './app.js';
import { LAUNCHED, FEATURED_PRICE, VERIFIED_PRICE, SPOTLIGHT_PRICE, PAY_URL } from './config.js';
const payHref = (item, price) => PAY_URL || ('pay.html?item=' + encodeURIComponent(item) + '&price=' + encodeURIComponent(price));
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');
const me = ctx.profile;

document.getElementById('mypage').href = 'profile.html?u=' + encodeURIComponent(me.username);
sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient', me.id).eq('read', false)
  .then(({count})=>{ if(count) document.getElementById('chatNav').textContent = 'chats · ' + count; });
sb.from('follows').select('*',{count:'exact',head:true}).eq('followed', me.id).eq('seen', false)
  .then(({count})=>{ if(count){ const n=document.getElementById('notifNav'); n.style.display='inline-flex'; n.textContent = '🔔 ' + count; } });

// secret preview: add ?preview=1 to the URL to see the live marketplace before launch
const LIVE = LAUNCHED || new URLSearchParams(location.search).get('preview') === '1';
if(!LIVE){
  // ---------- PRE-LAUNCH HOLDING SCREEN ----------
  document.getElementById('appwrap').style.maxWidth='100%';
  document.getElementById('appwrap').innerHTML = `
    <div class="prep">
      <div class="big" data-text="MARKETPLACE">MARKETPLACE</div>
      <div class="big2">in preparation<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
      <p class="sub">
        creators and brands are joining <span class="grad2">right now</span>.<br>
        your profile is locked in. you'll be here from <span class="grad2">day one</span> when the doors open.
      </p>
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:38px">
        <a class="btn" id="prepProfile" href="#" style="font-size:1.2rem;padding:21px 50px;background:linear-gradient(120deg,#2E4A73,#6E96C8,#D98BB0);background-size:220% 100%;color:#fff;transition:background-position .5s,transform .25s">my profile →</a>
        <a class="btn" href="https://discord.gg/kXcK5W9HC" target="_blank" rel="noopener" style="font-size:1.2rem;padding:21px 50px;background:linear-gradient(120deg,#5865F2,#7983F5);color:#fff">join the discord 💬</a>
        <a class="btn" href="https://x.com/yougcmarket" target="_blank" rel="noopener" style="font-size:1.2rem;padding:21px 46px;background:#0F1419;color:#fff;display:inline-flex;align-items:center;gap:10px"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>follow on X</a>
      </div>
      <div class="prepcards">
        <div class="card">
          <div class="ptitle">be first through the doors 🔔</div>
          <div class="psub">get an email the moment the marketplace opens.</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <input type="email" id="wlEmail" style="flex:1;min-width:180px">
            <button class="btn small" id="wlBtn" style="padding:15px 30px;background:linear-gradient(120deg,#6E96C8,#D98BB0);font-size:.95rem">notify me 🔔</button>
          </div>
          <div class="msg" id="wlMsg"></div>
        </div>
        <div class="card"><div class="refbox">
          <div class="rtitle">your referral link 🔗</div>
          <div class="rsub">friend joins through your link: <b>they get 10% off</b> their next purchase, <b>you get 10% off</b> yours.</div>
          <div class="refrow">
            <input type="text" id="refLink" readonly>
            <button class="btn small" id="refCopy">copy</button>
          </div>
          <div class="refcount" id="refCount"></div>
        </div></div>
      </div>
      <div class="prepmarq"><div class="ptrack">
        creators joining &nbsp;·&nbsp; <b>brands watching</b> &nbsp;·&nbsp; profiles building &nbsp;·&nbsp; <b>deals loading</b> &nbsp;·&nbsp; doors opening soon &nbsp;·&nbsp; creators joining &nbsp;·&nbsp; <b>brands watching</b> &nbsp;·&nbsp; profiles building &nbsp;·&nbsp; <b>deals loading</b> &nbsp;·&nbsp; doors opening soon &nbsp;·&nbsp;
      </div></div>
    </div>`;
  document.getElementById('prepProfile').href = 'profile.html?u=' + encodeURIComponent(me.username);

  // referral bubble
  const refUrl = location.origin + '/?ref=' + encodeURIComponent(me.username);
  document.getElementById('refLink').value = refUrl;
  document.getElementById('refCopy').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(refUrl); }catch(e){ document.getElementById('refLink').select(); document.execCommand('copy'); }
    document.getElementById('refCopy').textContent='copied ✓';
    setTimeout(()=>document.getElementById('refCopy').textContent='copy',1600);
  });
  sb.from('referrals').select('id',{count:'exact',head:true}).eq('referrer_username', me.username)
    .then(({count})=>{ if(count) document.getElementById('refCount').textContent = count + (count===1?' friend joined':' friends joined') + '. your code: YOUGC10-' + me.username.toUpperCase(); });
  sb.from('referrals').select('referrer_username').eq('referred', me.id).maybeSingle()
    .then(({data})=>{ if(data) document.getElementById('refCount').textContent += (document.getElementById('refCount').textContent?' · ':'') + 'you joined via @' + data.referrer_username + '. code YOUGC10-' + me.username.toUpperCase() + ' = 10% off your next purchase'; });

  // launch notification
  const wlInp=document.getElementById('wlEmail'), wlBtn=document.getElementById('wlBtn'), wlMsg=document.getElementById('wlMsg');
  wlInp.value = ctx.user.email || '';
  wlBtn.addEventListener('click', async ()=>{
    const email=wlInp.value.trim().toLowerCase();
    wlMsg.className='msg';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showMsg(wlMsg,'enter a valid email.'); return; }
    wlBtn.innerHTML='<span class="spin"></span>';
    const { error } = await sb.from('waitlist').insert({ email });
    wlBtn.textContent='notify me';
    if(error){
      if((error.message||'').includes('duplicate')) showMsg(wlMsg,"you're on the list already.", true);
      else showMsg(wlMsg,'something went wrong. try again.');
    } else showMsg(wlMsg,"locked in. you'll get the launch email.", true);
  });

  // ---------- logo drifting in space, nudged by your cursor ----------
  if(window.innerWidth > 760){
  const fl = document.createElement('div');
  fl.className = 'floatlogo';
  fl.innerHTML = '<img src="logo.png" alt="YOUgc">';
  document.body.appendChild(fl);
  const rect = () => fl.getBoundingClientRect();
  let x = innerWidth*0.14, y = innerHeight*0.68;
  let vx = 1.15, vy = -0.85;
  const MINSP = 0.85, MAXSP = 9;
  function loop(){
    const w = rect().width || 140, h = rect().height || 50;
    x += vx; y += vy;
    vx *= 0.9988; vy *= 0.9988;           // barely any drag, so it keeps travelling
    const sp = Math.hypot(vx,vy);
    if(sp < MINSP){ const k = MINSP/Math.max(sp,.01); vx *= k; vy *= k; }
    if(sp > MAXSP){ const k = MAXSP/sp; vx *= k; vy *= k; }
    if(x < 0){ x = 0; vx = Math.abs(vx); }
    if(y < 0){ y = 0; vy = Math.abs(vy); }
    if(x + w > innerWidth){ x = innerWidth - w; vx = -Math.abs(vx); }
    if(y + h > innerHeight){ y = innerHeight - h; vy = -Math.abs(vy); }
    fl.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(loop);
  }
  loop();
  // cursor hit test on the real logo box, so it reacts the moment you actually touch it
  window.addEventListener('mousemove', e=>{
    const w = rect().width || 140, h = rect().height || 50;
    const pad = 4;
    const l = x - pad, t = y - pad, r = x + w + pad, b = y + h + pad;
    const nx = Math.max(l, Math.min(e.clientX, r));
    const ny = Math.max(t, Math.min(e.clientY, b));
    const d = Math.hypot(e.clientX - nx, e.clientY - ny);
    if(d > 0.5) return;                    // not touching it yet
    const cx = x + w/2, cy = y + h/2;
    let dx = cx - e.clientX, dy = cy - e.clientY;
    let m = Math.hypot(dx,dy) || 1;
    dx /= m; dy /= m;
    const kick = 5.2;
    vx = dx*kick + vx*0.25;
    vy = dy*kick + vy*0.25;
  }, {passive:true});
  }

} else {
  // ---------- LIVE MARKETPLACE ----------
  {
    document.getElementById('composer').style.display='block';
    document.getElementById('featPrice').textContent = FEATURED_PRICE;
    document.getElementById('featLink').href = payHref('featured post @' + me.username, FEATURED_PRICE);

    // ---- spotlight row: 2 creators + 2 brands on top ----
    (async ()=>{
      const { data: sp } = await sb.from('profiles').select('*').gt('spotlight_until', new Date().toISOString()).limit(20);
      const cs=(sp||[]).filter(p=>p.role==='creator').slice(0,2);
      const bs=(sp||[]).filter(p=>p.role==='brand').slice(0,2);
      const mk = p => `<a class="spotcard" href="profile.html?u=${encodeURIComponent(p.username)}">${avatarHTML(p)}<div style="min-width:0"><div class="sname">${esc(p.name)}${vbadge(p)}</div><span class="rolebadge ${p.role}">${p.role}</span>${p.bio?`<div class="sbio">${esc(p.bio.length>70?p.bio.slice(0,70)+'…':p.bio)}</div>`:''}</div></a>`;
      const cards = [...cs.map(mk), ...bs.map(mk)];
      document.getElementById('spotrow').innerHTML = cards.length
        ? `<div class="spotrow"><div class="spotlabel">🔥 spotlight</div>${cards.join('')}</div>` : '';
    })();
    const postImgInp = document.getElementById('postImg');
    document.getElementById('postImgBtn').addEventListener('click', ()=> postImgInp.click());
    postImgInp.addEventListener('change', ()=>{
      const f = postImgInp.files[0];
      document.getElementById('postImgBtn').textContent = f ? ('📷 ' + f.name.slice(0,26) + ' ✓') : '📷 add a picture';
    });
    document.getElementById('postBtn').addEventListener('click', async ()=>{
      const t = document.getElementById('postText').value.trim();
      const msg = document.getElementById('postMsg'); msg.className='msg';
      if(!t){ showMsg(msg,'write something first.'); return; }
      if(hasSlurs(t)){ showMsg(msg,'that language has no place here. rewrite it.'); return; }
      if(hasBadLinks(t)){ showMsg(msg,'links like that have no place here.'); return; }
      const btn=document.getElementById('postBtn'); btn.innerHTML='<span class="spin"></span>';
      let img = null;
      const pf = postImgInp.files[0];
      if(pf){
        if(pf.size > 8*1024*1024){ showMsg(msg,'picture too big, max 8 MB.'); btn.textContent='post'; return; }
        const safe = pf.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-50);
        const path = 'posts/' + me.id + '/' + Date.now() + '_' + safe;
        const { error: upErr } = await sb.storage.from('chatfiles').upload(path, pf);
        if(upErr){ showMsg(msg,'picture upload failed. try again.'); btn.textContent='post'; return; }
        img = sb.storage.from('chatfiles').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from('posts').insert({ user_id: me.id, text: t, img });
      if(error){
        const m = error.message||'';
        showMsg(msg, m.includes('no_slurs') ? 'that language has no place here. rewrite it.'
          : m.includes('duplicate post') ? 'you already posted this. say something new.'
          : m.includes('no place here') ? 'links like that have no place here.'
          : m.includes('row-level') ? 'you posted recently. the 12 hour lock is still running.' : m);
        btn.textContent='post';
      } else {
        postImgInp.value=''; document.getElementById('postImgBtn').textContent='📷 add a picture';
        document.getElementById('postText').value='';
        showMsg(msg, 'posted. next post unlocks in 12 hours.', true);
        btn.textContent='locked for 12h';
        btn.disabled = true;
        btn.style.opacity = '.55';
        load();
      }
    });
  }


  // ---- match finder: ask who fits you best ----
  const mfLabel = me.role==='brand' ? 'find creators' : 'find brands';
  document.body.insertAdjacentHTML('beforeend', `
    <button class="mfbtn" id="mfBtn">✨ ${mfLabel}</button>
    <div class="card mfpanel" id="mfPanel">
      <div class="mfhead"><span>✨ <span class="grad">${mfLabel}</span></span><span class="x" id="mfClose">✕</span></div>
      <div class="mflog" id="mfLog"></div>
      <div class="mfbar"><input type="text" id="mfInp" maxlength="200" placeholder="what are you looking for?"><button class="btn small" id="mfSend">find</button></div>
    </div>`);
  const mfLog = document.getElementById('mfLog');
  const mfHello = me.role==='brand'
    ? `say what you need, i scan every creator for your best fit.`
    : `say what you create, i scan every brand for your best fit.`;
  mfLog.innerHTML = `<div class="mfb bot">${mfHello}</div>`;
  document.getElementById('mfBtn').addEventListener('click', ()=>{ document.getElementById('mfPanel').classList.toggle('open'); document.getElementById('mfInp').focus(); });
  document.getElementById('mfClose').addEventListener('click', ()=> document.getElementById('mfPanel').classList.remove('open'));

  const SYN = {vegan:'food',recipe:'food',recipes:'food',cooking:'food',cook:'food',restaurant:'food',foodie:'food',gym:'fitness',workout:'fitness',fit:'fitness',makeup:'beauty',skincare:'beauty',cosmetics:'beauty',web3:'crypto',nft:'crypto',bitcoin:'crypto',defi:'crypto',trading:'finance',invest:'finance',investing:'finance',money:'finance',game:'gaming',games:'gaming',gamer:'gaming',esports:'gaming',ml:'AI',chatgpt:'AI',artificial:'AI',auto:'cars',car:'cars',automotive:'cars',clothes:'fashion',clothing:'fashion',streetwear:'fashion',outfit:'fashion',sport:'sports',football:'sports',soccer:'sports',basketball:'sports',dog:'pets',dogs:'pets',cat:'pets',cats:'pets',meme:'memes',funny:'comedy',humor:'comedy',vlog:'vlogging',vlogs:'vlogging',wellness:'health',travelling:'travel',traveling:'travel',song:'music',songs:'music',unbox:'unboxing'};
  const STOP = new Set(['the','and','for','with','who','what','which','best','content','looking','look','need','needs','someone','want','wants','good','creator','creators','brand','brands','people','person','right','now','into','that','this','are','can','you','make','makes','making','made','create','creates','creating','video','videos','some','about','from','have','get','find','one','ones','just','really','all','any','top']);
  function lev(a,b){
    if(Math.abs(a.length-b.length)>3) return 9;
    const m=a.length,n=b.length,d=[];
    for(let i=0;i<=m;i++) d[i]=[i];
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[m][n];
  }
  const nlAll = NICHES.map(n=>n.toLowerCase());
  function nicheFor(t){
    if(nlAll.includes(t)) return t;
    const tol = t.length>=8 ? 3 : t.length>=5 ? 2 : 1;
    let best=null, bd=9;
    for(const n of nlAll){ const d=lev(t,n); if(d<bd){ bd=d; best=n; } }
    return bd<=tol ? best : null;
  }
  function baseScore(p){
    let s=0;
    if(isVerified(p)) s+=1;
    if((p.clips||[]).length) s+=1;
    if(p.avatar_url) s+=.4;
    if(p.bio) s+=.3;
    s+=Math.min(Object.keys(p.socials||{}).length,3)*.2;
    return s;
  }
  function whyLine(p, hits){
    const why=[];
    if(hits && hits.size) why.push('matches ' + [...hits].slice(0,3).join(', '));
    const c=(p.clips||[]).length; if(c) why.push(c+' clip'+(c>1?'s':''));
    if(isVerified(p)) why.push('verified ✓');
    const l=Object.keys(p.socials||{}).length; if(l) why.push(l+' linked account'+(l>1?'s':''));
    return why.join(' · ') || 'young profile, worth a look';
  }
  function mfCard(x){
    return `<a class="mfcard" href="profile.html?u=${encodeURIComponent(x.p.username)}">
      ${avatarHTML(x.p)}
      <div style="min-width:0"><div class="mfn">${esc(x.p.name)}${vbadge(x.p)}</div>
      <div class="mfr">${esc(x.why)}</div></div></a>`;
  }
  let mfState = { list:[], shown:0, target:null };

  async function mfFind(q){
    const ql = q.toLowerCase();
    // how many did they ask for?
    const cntM = ql.match(/\b([1-9]\d?)\b/);
    const limit = cntM ? Math.min(parseInt(cntM[1],10), 10) : 5;
    // follow-up: show the next ones instead of repeating
    if(/^(any\s*)?(more|next|another|others?|show\s*more)\??!?\s*$/.test(ql.trim()) && mfState.list.length){
      const next = mfState.list.slice(mfState.shown, mfState.shown+limit);
      if(!next.length) return `that's everyone matching that search right now. new ${mfState.target==='creator'?'creators':'brands'} join daily, ask me again soon.`;
      mfState.shown += next.length;
      return `next best matches:` + next.map(mfCard).join('');
    }
    // "show me everyone / all users"
    if(/\b(all|every(one|body)?|users|members|profiles)\b/.test(ql) && !/\bfor\b/.test(ql)){
      const { data: allp } = await sb.from('profiles').select('*').limit(500);
      const rows = (allp||[]).filter(p=>p.id!==me.id).map(p=>({ p, s: baseScore(p), why: (p.role==='creator'?'creator':'brand') + ' · ' + whyLine(p, null) })).sort((a,b)=>b.s-a.s);
      mfState = { list: rows, shown: Math.min(limit, rows.length), target: me.role==='brand'?'creator':'brand' };
      if(!rows.length) return 'nobody else here yet. you are early, that is the whole point.';
      return `everyone on here, strongest profiles first:` + rows.slice(0,limit).map(mfCard).join('') + (rows.length>limit?`<div style="font-size:.78rem;color:var(--ink-soft);margin-top:8px">say <b>"more"</b> for the next ones.</div>`:'');
    }
    let target = me.role==='brand' ? 'creator' : 'brand';
    const words = ql.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2);
    const saysBrand = words.some(w=>lev(w,'brand')<=1||lev(w,'brands')<=1);
    const saysCreator = words.some(w=>lev(w,'creator')<=2||lev(w,'creators')<=2);
    if(saysBrand && !saysCreator) target='brand';
    if(saysCreator && !saysBrand) target='creator';
    const other = target==='creator' ? 'brand' : 'creator';
    const rawToks = [...new Set(words.filter(w=>!STOP.has(w)).map(w=>SYN[w]||w))];
    const toks = rawToks.map(t=>({ t, niche: nicheFor(t) })).filter(x=>lev(x.t,'brand')>1&&lev(x.t,'brands')>1&&lev(x.t,'creator')>2&&lev(x.t,'creators')>2);
    // no niche words in the question? match against their own profile instead ("who fits me")
    if(!toks.some(x=>x.niche) && (me.niches||[]).length){
      (me.niches||[]).forEach(n=>{ const nn=String(n).toLowerCase(); toks.push({ t:nn, niche: nlAll.includes(nn)?nn:null }); });
    }
    const { data: profs } = await sb.from('profiles').select('*').limit(500);
    const all = (profs||[]).filter(p=>p.id!==me.id);
    function scoreFor(p){
      const pn = (p.niches||[]).map(n=>String(n).toLowerCase());
      const hay = (pn.join(' ')+' '+(p.bio||'')+' '+(p.name||'')).toLowerCase();
      let s=0; const hits=new Set();
      toks.forEach(({t,niche})=>{
        if(niche && pn.includes(niche)){ s+=3; hits.add(niche); }
        else if(hay.includes(t)){ s+=1.2; if(pn.includes(t)) hits.add(t); }
      });
      return { s, hits };
    }
    const scored = all.filter(p=>p.role===target).map(p=>{
      const { s, hits } = scoreFor(p);
      return { p, s: s>0 ? s+baseScore(p) : 0, hits, why: whyLine(p, hits) };
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    // did the other side match the same words?
    const oppHit = all.filter(p=>p.role===other).map(p=>{
      const { s, hits } = scoreFor(p);
      return { p, s, why: whyLine(p, hits) };
    }).filter(x=>x.s>=3).sort((a,b)=>b.s-a.s).slice(0,2);
    if(!scored.length){
      mfState = { list:[], shown:0, target };
      const strongest = all.filter(p=>p.role===target)
        .map(p=>({ p, s: baseScore(p), why: whyLine(p, null) }))
        .sort((a,b)=>b.s-a.s).slice(0,3);
      let out = strongest.length
        ? `here's who fits you best right now:` + strongest.map(mfCard).join('')
        : `the marketplace is young, more ${target==='creator'?'creators':'brands'} join every day. you're early, that's the advantage.`;
      if(oppHit.length) out += `<div style="margin-top:10px">also a strong fit on the ${other} side:</div>` + oppHit.map(mfCard).join('');
      return out;
    }
    mfState = { list: scored, shown: Math.min(limit, scored.length), target };
    let out = `found your best ${target==='creator'?'creator':'brand'} matches:` + scored.slice(0,limit).map(mfCard).join('');
    if(scored.length>limit) out += `<div style="font-size:.78rem;color:var(--ink-soft);margin-top:8px">say <b>"more"</b> for the next ones.</div>`;
    if(oppHit.length) out += `<div style="margin-top:10px">also matching on the ${other} side:</div>` + oppHit.map(mfCard).join('');
    return out;
  }
  async function mfGo(){
    const inp = document.getElementById('mfInp');
    const q = inp.value.trim(); if(!q) return;
    inp.value='';
    mfLog.insertAdjacentHTML('beforeend', `<div class="mfb user">${esc(q)}</div><div class="mfb bot" id="mfThink">scanning profiles…</div>`);
    mfLog.scrollTop = mfLog.scrollHeight;
    const ans = await mfFind(q);
    document.getElementById('mfThink').removeAttribute('id');
    mfLog.lastElementChild.innerHTML = ans;
    mfLog.scrollTop = mfLog.scrollHeight;
  }
  document.getElementById('mfSend').addEventListener('click', mfGo);
  document.getElementById('mfInp').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); mfGo(); } });

  // profile search
  let srchT = null;
  const srchRes = document.getElementById('searchRes');
  document.getElementById('searchInp').addEventListener('input', e=>{
    clearTimeout(srchT);
    const q = e.target.value.trim();
    if(q.length < 2){ srchRes.innerHTML=''; return; }
    srchT = setTimeout(async ()=>{
      const safe = q.replace(/[%_,()]/g,'');
      const { data } = await sb.from('profiles').select('*')
        .or(`username.ilike.%${safe}%,name.ilike.%${safe}%`).limit(8);
      srchRes.innerHTML = (data&&data.length)
        ? `<div class="spotrow" style="margin-top:0">${data.map(p=>`<a class="spotcard" href="profile.html?u=${encodeURIComponent(p.username)}">${avatarHTML(p)}<div style="min-width:0"><div class="sname">${esc(p.name)}${vbadge(p)}</div><span class="rolebadge ${p.role}">${p.role}</span></div></a>`).join('')}</div>`
        : '<p class="muted" style="margin:4px 0 14px">nobody found for that search.</p>';
    }, 280);
  });

  let tab='creators', activeNiches=new Set(), mineOnly=false;
  const filterEl=document.getElementById('filterChips');
  const TOP_NICHES = ['lifestyle','crypto','beauty','fitness','fashion','gaming','food','travel'];
  filterEl.innerHTML = `<span class="chip filter" id="mineChip">✨ my categories</span>` +
    TOP_NICHES.map(n=>`<span class="chip filter" data-n="${esc(n)}">${esc(n)}</span>`).join('');
  filterEl.addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    if(c.id==='mineChip'){ mineOnly=!mineOnly; c.classList.toggle('on'); render(); return; }
    const n=c.dataset.n;
    activeNiches.has(n)?activeNiches.delete(n):activeNiches.add(n);
    c.classList.toggle('on');
    render();
  });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); tab=t.dataset.tab; render();
  }));

  function render(){
    document.getElementById('mainGrid').classList.toggle('wide', tab!=='posts');
    document.getElementById('searchRes').innerHTML='';
    if(tab==='creators') loadPeople('creator');
    else if(tab==='brands') loadPeople('brand');
    else load();
  }

  async function loadPeople(role){
    const feed=document.getElementById('feed');
    feed.innerHTML='<p class="muted center mt3">loading…</p>';
    const { data, error } = await sb.from('profiles').select('*').eq('role', role).limit(500);
    if(error){ feed.innerHTML=`<p class="muted center mt3">${esc(error.message)}</p>`; return; }
    let rows=(data||[]);
    const mine=new Set(me.niches||[]);
    if(mineOnly && mine.size) rows=rows.filter(p=>(p.niches||[]).some(n=>mine.has(n)));
    if(activeNiches.size) rows=rows.filter(p=>(p.niches||[]).some(n=>activeNiches.has(n)));
    const score=p=>((p.spotlight_until&&new Date(p.spotlight_until).getTime()>Date.now())?10:0)+(isVerified(p)?3:0)+((p.clips||[]).length?2:0)+(p.avatar_url?1:0)+(p.bio?1:0)+Math.min(Object.keys(p.socials||{}).length,3)*.5;
    rows.sort((a,b)=>score(b)-score(a));
    if(!rows.length){
      feed.innerHTML = `<div class="card center"><p class="muted">no ${role==='creator'?'creators':'brands'} for these filters yet. new people join daily.</p></div>`;
      return;
    }
    feed.innerHTML = `<div class="pplgrid">` + rows.map(p=>{
      const clips=(p.clips||[]).length;
      const socials=Object.keys(p.socials||{}).length;
      const stat=[clips?clips+' clip'+(clips>1?'s':''):null, socials?socials+' social'+(socials>1?'s':'')+' linked':null].filter(Boolean).join(' · ');
      return `<a class="pcard" href="profile.html?u=${encodeURIComponent(p.username)}">
        ${avatarHTML(p)}
        <div class="pcname">${esc(p.name)}${vbadge(p)}</div>
        <div class="pcuser">@${esc(p.username)}</div>
        <div class="pcbio">${esc(p.bio||'')}</div>
        <div class="pcchips">${(p.niches||[]).slice(0,3).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
        ${stat?`<div class="pcstat">${stat}</div>`:''}
        <span class="pcbtn">view profile →</span>
      </a>`;}).join('')+`</div>`;
  }

  async function load(){
    const feed=document.getElementById('feed');
    feed.innerHTML='<p class="muted center mt3">loading…</p>';
    const { data, error } = await sb.from('posts')
      .select('id,text,img,created_at,featured_until,profiles(id,username,name,avatar_url,niches,role,verified)')
      .order('created_at',{ascending:false}).limit(100);
    if(error){ feed.innerHTML=`<p class="muted center mt3">${esc(error.message)}</p>`; return; }
    let rows = (data||[]).filter(p=>p.profiles);
    const isFeatRaw = p => p.featured_until && new Date(p.featured_until).getTime() > Date.now();
    const featTop = rows.filter(isFeatRaw).slice(0,5);
    const isFeat = p => featTop.includes(p);
    rows = [...featTop, ...rows.filter(p=>!featTop.includes(p))];
    if(mineOnly && me.niches?.length){
      const mine=new Set(me.niches);
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>mine.has(n)));
    }
    if(activeNiches.size){
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>activeNiches.has(n)));
    }
    if(!rows.length){
      feed.innerHTML = `<div class="card center"><p class="muted">no posts here yet. be the first, the composer is on the right.</p></div>`;
      return;
    }
    feed.innerHTML = '<div class="postgrid">' + rows.map(p=>`
      <div class="card post${isFeat(p)?' featured':''}">
        ${isFeat(p)?'<span class="featbadge">🔥 featured</span>':''}
        <div class="phead">
          ${avatarHTML(p.profiles)}
          <div>
            <a class="pname" href="profile.html?u=${encodeURIComponent(p.profiles.username)}">${esc(p.profiles.name)}</a>${vbadge(p.profiles)} <span class="rolebadge ${p.profiles.role}">${p.profiles.role==='creator'?'creator':'brand'}</span>
            <div class="pmeta">@${esc(p.profiles.username)} · ${timeAgo(p.created_at)}</div>
          </div>
        </div>
        <div class="ptext">${esc(p.text)}</div>
        ${p.img?`<a href="${esc(p.img)}" target="_blank" rel="noopener"><img class="postimg" src="${esc(p.img)}" loading="lazy"></a>`:''}
        <div class="ptags">${(p.profiles.niches||[]).slice(0,6).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
      </div>`).join('') + '</div>';
  }
  render();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane.wide{max-width:1360px}
.profGrid{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start;margin-top:6px}
@media(max-width:980px){.profGrid{grid-template-columns:1fr}}
.avatar.big{width:160px;height:160px}
#profileCard h1.page{font-size:clamp(2.4rem,4.8vw,3.7rem)}
#profileCard{padding:48px 52px}
.pmeta{font-size:1rem}
#profileCard .ptags span{font-size:.98rem;padding:11px 24px}
.socialrow{gap:14px}
.socialrow a{font-size:1.05rem;padding:16px 30px}
#profileCard .vbadge{width:29px;height:29px;font-size:1rem}
#profileCard .btn{font-size:1.02rem;padding:16px 32px}
#profileCard .btn.small, .refbox .btn{font-size:.9rem;padding:13px 26px}
h2.page{font-size:1.7rem !important;margin-top:4px}
.post .ptext{font-size:1rem}
.clipgrid{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px}
.clip{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.85);border:1.5px solid rgba(30,51,80,.08)}
.clip iframe{display:block;width:100%;border:0}
.clip.tall{width:min(100%,260px)}
.clip.tall iframe{aspect-ratio:9/16}
.clip.wide{width:min(100%,470px)}
.clip.wide iframe{aspect-ratio:16/9}
.clipgrid.multi .clip.tall{width:min(100%,205px)}
.clipgrid.multi .clip.wide{width:min(100%,364px)}
.gig{padding:24px 28px;border-radius:20px;background:linear-gradient(120deg,rgba(191,215,242,.45),rgba(244,207,223,.4));margin-top:14px}
.gigbadge{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:linear-gradient(120deg,#2E4A73,#6E96C8);color:#fff;margin-bottom:10px}
.gig p{line-height:1.7;font-size:1rem}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="app.html">marketplace</a>
      <a class="nav-cta" href="chat.html">chats</a>
    </div>
  </nav>

  <div class="pane wide">
    <div class="profGrid">
      <div class="card reveal on" id="profileCard"><p class="muted center">loading…</p></div>
      <aside>
        <h2 class="page">latest posts</h2>
        <div id="posts" class="mt1"></div>
      </aside>
    </div>
  </div>
</div>

<script type="module">
import { sb, currentUser, blobsHTML, initMotion, logoHTML, esc, timeAgo, avatarHTML, vbadge, SOCIAL_FIELDS, clipEmbed } from './app.js';
import { VERIFIED_PRICE, SPOTLIGHT_PRICE, PAY_URL } from './config.js';
const ACCENTS = { blue:['#BFD7F2','#DCE9F9'], pink:['#F4CFDF','#FBE3EE'], mint:['#BFE8D4','#DFF2E7'], lavender:['#D8CCF2','#EAE3F9'], peach:['#F8D8C4','#FBEBDD'], sand:['#EFE3C6','#F7F0DE'] };
const payHref = (item, price) => PAY_URL || ('pay.html?item=' + encodeURIComponent(item) + '&price=' + encodeURIComponent(price));
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const username = new URLSearchParams(location.search).get('u');
const card = document.getElementById('profileCard');
const { data: p } = await sb.from('profiles').select('*').eq('username', username).maybeSingle();

if(!p){
  card.innerHTML = '<p class="muted center">profile not found.</p>';
} else {
  document.title = p.name + ' · YOUgc';
  const u = await currentUser();
  const isOwner = !!(u && u.id === p.id);
  const ac = ACCENTS[p.accent] || ACCENTS.blue;
  card.style.background = `radial-gradient(circle at 18% 12%, ${ac[0]}B3, transparent 58%), radial-gradient(circle at 88% 85%, ${ac[1]}A6, transparent 55%), radial-gradient(circle at 60% 40%, ${ac[0]}40, transparent 60%), rgba(255,255,255,.8)`;
  const joined = new Date(p.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}).toLowerCase();
  const { count: followers } = await sb.from('follows').select('*',{count:'exact',head:true}).eq('followed', p.id);
  let iFollow = false;
  if(u && !isOwner){
    const { data: f } = await sb.from('follows').select('follower').eq('follower', u.id).eq('followed', p.id).maybeSingle();
    iFollow = !!f;
  }
  const socials = SOCIAL_FIELDS
    .filter(f => p.socials && p.socials[f.key])
    .map(f => `<a href="${esc(p.socials[f.key])}" target="_blank" rel="noopener">${f.label}</a>`)
    .join('');
  card.innerHTML = `
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      ${avatarHTML(p, true)}
      <div style="flex:1;min-width:200px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h1 class="page" style="margin:0">${esc(p.name)}</h1>${vbadge(p)}
          <span class="rolebadge ${p.role}">${p.role==='creator'?'creator':'brand'}</span>
        </div>
        <div class="pmeta">@${esc(p.username)} · <span id="folCount">${followers||0}</span> followers · joined ${joined}</div>
      </div>
    </div>
    ${p.bio ? `<p class="mt2" style="line-height:1.75;font-size:1.18rem;font-weight:500">${esc(p.bio)}</p>` : ''}
    <div id="clipsWrap"></div>
    <div id="gigsWrap"></div>
    <div class="ptags mt2">${(p.niches||[]).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
    ${socials ? `<div class="socialrow">${socials}</div>` : ''}
    ${!isOwner ? (u ? `<div class="mt3" style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" id="contact" href="chat.html?u=${encodeURIComponent(p.username)}">message ${esc(p.name.split(' ')[0])} →</a><button class="btn ghost" id="followBtn">${iFollow?'following ✓':'+ follow'}</button></div>` : `<a class="btn mt3" id="contact" href="auth.html">log in to message ${esc(p.name.split(' ')[0])} →</a>`) : ''}
    ${isOwner ? `<div class="mt3" style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:38px"><a class="btn" href="onboard.html">edit profile →</a><a class="btn ghost" href="settings.html">settings</a></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:18px">${p.verified?'':`<a class="btn ghost" href="${payHref('verified pack @'+p.username, VERIFIED_PRICE)}" title="✓ badge, pro look, 3 posts a day">get verified ✓ · $${VERIFIED_PRICE}</a>`}${(p.spotlight_until && new Date(p.spotlight_until)>new Date())?'':`<a class="btn ghost" href="${payHref('spotlight @'+p.username, SPOTLIGHT_PRICE)}" title="your profile pinned on top of the marketplace for 2 days">get spotlighted ✦ · $${SPOTLIGHT_PRICE} for 2 days</a>`}</div>
    <div class="refbox">
      <div class="rtitle">your YOUgc referral link</div>
      <div class="rsub">friend joins through your link: <b>they get 10% off</b> their next purchase, <b>you get 10% off</b> yours. your code: <b>YOUGC10-${esc(p.username.toUpperCase())}</b></div>
      <div class="refrow"><input type="text" id="refLink" readonly><button class="btn small" id="refCopy">copy</button></div>
      <div class="refcount" id="refCount"></div>
    </div>` : ''}
  `;

  // best clips (creators)
  const embeds = (p.clips||[]).map(clipEmbed).filter(Boolean);
  if(embeds.length){
    document.getElementById('clipsWrap').innerHTML =
      '<div class="clipgrid' + (embeds.length>1?' multi':'') + '">' + embeds.map(e=>
        `<div class="clip ${e.tall?'tall':'wide'}"><iframe src="${esc(e.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`
      ).join('') + '</div>';
  }

  // open job offers (brands)
  if(p.role==='brand'){
    const { data: gigs } = await sb.from('gigs').select('*').eq('user_id', p.id).eq('open', true).order('created_at',{ascending:false}).limit(5);
    if(gigs && gigs.length){
      document.getElementById('gigsWrap').innerHTML = gigs.map(g=>`
        <div class="gig">
          <span class="gigbadge">🔎 looking for creators</span>
          <p>${esc(g.text)}</p>
          <div class="pmeta" style="margin-top:8px">${timeAgo(g.created_at)}</div>
          ${isOwner
            ? `<button class="btn ghost small mt1" data-close="${g.id}">close this offer</button>`
            : (u ? `<a class="btn small mt1" href="chat.html?u=${encodeURIComponent(p.username)}&gig=${g.id}">apply →</a>` : `<a class="btn small mt1" href="auth.html">log in to apply →</a>`)}
        </div>`).join('');
      document.getElementById('gigsWrap').querySelectorAll('[data-close]').forEach(b=>
        b.addEventListener('click', async ()=>{ await sb.from('gigs').update({open:false}).eq('id', b.dataset.close); b.closest('.gig').remove(); }));
    }
  }

  const fb = document.getElementById('followBtn');
  if(fb){
    fb.addEventListener('click', async ()=>{
      if(fb.textContent.includes('following')){
        await sb.from('follows').delete().eq('follower', u.id).eq('followed', p.id);
        fb.textContent = '+ follow';
        document.getElementById('folCount').textContent = Math.max(0, parseInt(document.getElementById('folCount').textContent)-1);
      } else {
        const { error } = await sb.from('follows').insert({ follower: u.id, followed: p.id });
        if(!error){
          fb.textContent = 'following ✓';
          document.getElementById('folCount').textContent = parseInt(document.getElementById('folCount').textContent)+1;
        }
      }
    });
  }

  if(isOwner){
    const refUrl = location.origin + '/?ref=' + encodeURIComponent(p.username);
    document.getElementById('refLink').value = refUrl;
    document.getElementById('refCopy').addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(refUrl); }catch(e){ document.getElementById('refLink').select(); document.execCommand('copy'); }
      document.getElementById('refCopy').textContent='copied ✓';
      setTimeout(()=>document.getElementById('refCopy').textContent='copy',1600);
    });
    sb.from('referrals').select('id',{count:'exact',head:true}).eq('referrer_username', p.username)
      .then(({count})=>{ if(count) document.getElementById('refCount').textContent = count + (count===1?' friend joined':' friends joined') + ' through your link'; });
    sb.from('referrals').select('referrer_username').eq('referred', p.id).maybeSingle()
      .then(({data})=>{ if(data){ const el=document.getElementById('refCount'); el.textContent += (el.textContent?' · ':'') + 'you joined via @' + data.referrer_username + '. 10% off your next purchase locked in'; } });
  }

  const { data: posts } = await sb.from('posts').select('id,text,created_at').eq('user_id', p.id).order('created_at',{ascending:false}).limit(10);
  const wrap = document.getElementById('posts');
  wrap.innerHTML = (posts&&posts.length)
    ? posts.map(x=>`<div class="card post"><div class="pmeta" style="margin-bottom:8px">${timeAgo(x.created_at)}</div><div class="ptext">${esc(x.text)}</div></div>`).join('')
    : '<div class="card"><p class="muted center">no posts yet.</p></div>';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>join youGC</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top"><span id="logo"></span><a class="nav-cta" href="index.html">back</a></nav>
  <div class="pane">
    <div class="card reveal on">
      <h1 class="page" id="title">create your account</h1>
      <p class="sub" id="subtitle">two minutes and you're in.</p>

      <div id="roleRow" class="chips" style="margin-bottom:6px">
        <span class="chip" data-role="creator">i'm a creator</span>
        <span class="chip" data-role="brand">i need creators</span>
      </div>

      <label>email</label>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
      <label>password</label>
      <input type="password" id="password" placeholder="min 6 characters" autocomplete="new-password">

      <button class="btn full mt2" id="go">create account</button>
      <div class="msg" id="msg"></div>
      <p class="muted mt2 center" id="switchline">already have an account? <a href="#" id="switch" style="color:var(--cblue);font-weight:600">log in</a></p>
    </div>
  </div>
</div>

<script type="module">
import { sb, myProfile, blobsHTML, initMotion, logoHTML, showMsg } from './app.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const params = new URLSearchParams(location.search);
let mode = params.get('mode') === 'login' ? 'login' : 'signup';
let role = params.get('role') === 'brand' ? 'brand' : (params.get('role') === 'creator' ? 'creator' : null);

const title = document.getElementById('title'), subtitle = document.getElementById('subtitle');
const roleRow = document.getElementById('roleRow'), go = document.getElementById('go');
const sw = document.getElementById('switch'), switchline = document.getElementById('switchline');
const msg = document.getElementById('msg');

function paintRole(){
  [...roleRow.children].forEach(c => c.classList.toggle('on', c.dataset.role === role));
}
roleRow.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  role = c.dataset.role; paintRole();
});
paintRole();

function paintMode(){
  if(mode === 'login'){
    title.textContent = 'welcome back';
    subtitle.textContent = 'log in to your account.';
    go.textContent = 'log in';
    roleRow.style.display = 'none';
    switchline.firstChild.textContent = "new here? ";
    sw.textContent = 'create an account';
  } else {
    title.textContent = 'create your account';
    subtitle.textContent = "two minutes and you're in.";
    go.textContent = 'create account';
    roleRow.style.display = 'flex';
    switchline.firstChild.textContent = 'already have an account? ';
    sw.textContent = 'log in';
  }
}
sw.addEventListener('click', e => { e.preventDefault(); mode = mode==='login'?'signup':'login'; paintMode(); });
paintMode();

// already logged in? route forward
(async()=>{
  const p = await myProfile().catch(()=>null);
  const { data:{ user } } = await sb.auth.getUser();
  if(user){ location.href = p ? 'app.html' : 'onboard.html'; }
})();

go.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  msg.className = 'msg';
  if(!email || password.length < 6){ showMsg(msg,'enter a valid email and a password with at least 6 characters.'); return; }
  if(mode === 'signup' && !role){ showMsg(msg,'pick one: are you a creator, or do you need creators?'); return; }
  go.innerHTML = '<span class="spin"></span>';
  try{
    if(mode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(!data.session){
        // email confirmation is ON in supabase — try direct login anyway
        const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
        if(e2){ showMsg(msg,'account created — check your email to confirm, then log in.', true); go.textContent='create account'; return; }
      }
      sessionStorage.setItem('yougc_role', role);
      location.href = 'onboard.html';
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      const p = await myProfile();
      location.href = p ? 'app.html' : 'onboard.html';
    }
  }catch(err){
    showMsg(msg, err.message || 'something went wrong — try again.');
    go.textContent = mode==='login' ? 'log in' : 'create account';
  }
});
</script>
</body>
</html>

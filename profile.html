<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="a creator profile on YOUgc: clips, niches, links and a direct message button."><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane.wide{max-width:1460px}
.profGrid{display:grid;grid-template-columns:1fr 400px;gap:38px;align-items:start;margin-top:6px}
@media(max-width:980px){.profGrid{grid-template-columns:1fr}}
.avatar.big{width:160px;height:160px}
#profileCard h1.page{font-size:clamp(2.4rem,4.8vw,3.7rem)}
#profileCard{padding:52px 58px}
.pmeta{font-size:1rem}
#profileCard .ptags span{font-size:.98rem;padding:11px 24px}
.socialrow{gap:14px}
.socialrow a{font-size:1.05rem;padding:16px 30px}
#profileCard .vbadge{width:29px;height:29px;font-size:1rem}
#profileCard .btn{font-size:1.02rem;padding:16px 32px}
#profileCard .btn.small, .refbox .btn{font-size:.9rem;padding:13px 26px}
h2.page{font-size:1.7rem !important;margin-top:4px}
.post .ptext{font-size:1rem}
.clipgrid{display:flex;gap:18px;margin-top:26px;overflow-x:auto;padding:8px 4px 16px;scroll-snap-type:x proximity}
.clipgrid::-webkit-scrollbar{height:7px}
.clipgrid::-webkit-scrollbar-thumb{background:rgba(30,51,80,.18);border-radius:99px}
.clipgrid::-webkit-scrollbar-track{background:transparent}
.clip{flex:0 0 auto;height:340px;border-radius:22px;overflow:hidden;scroll-snap-align:start;border:2.5px solid transparent;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,linear-gradient(120deg,#BFD7F2,#F4CFDF,#BFE8D4) border-box;
  box-shadow:0 16px 36px -18px rgba(46,74,115,.4);
  transition:transform .3s,box-shadow .3s;will-change:transform;
  animation:clipfloat 6s ease-in-out infinite alternate}
.clip:nth-child(2){animation-delay:.9s;animation-duration:7.1s}
.clip:nth-child(3){animation-delay:1.7s;animation-duration:6.4s}
@keyframes clipfloat{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.clip:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 26px 54px -20px rgba(110,150,200,.65);animation-play-state:paused;
  background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) padding-box,linear-gradient(120deg,#6E96C8,#D98BB0,#E8926B) border-box}
.clip iframe{display:block;height:100%;border:0}
.clip.tall iframe{width:191px}
.clip.wide iframe{width:604px}

/* ---- owner actions + paid perks ---- */
.ownerrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:40px;padding-top:32px;border-top:1.5px solid rgba(30,51,80,.09)}
.upsell{margin-top:38px;padding:34px 34px 32px;border-radius:30px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(191,215,242,.42),rgba(244,207,223,.34) 52%,rgba(191,232,212,.4));
  border:2px solid rgba(255,255,255,.85)}
.upsell::before{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(64px);top:-120px;right:-90px;animation:upfl 9s ease-in-out infinite alternate}
@keyframes upfl{from{transform:translate(0,0)}to{transform:translate(-40px,40px)}}
.uphead{position:relative;text-align:center;margin-bottom:22px}
.upkick{font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#5A6A85}
.uphead h3{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:800;letter-spacing:-.03em;margin-top:6px;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.upgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:880px){.upgrid{grid-template-columns:1fr}}
.upcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 20px 22px;border-radius:22px;
  background:rgba(255,255,255,.92);text-decoration:none;color:inherit;box-shadow:0 18px 40px -22px rgba(46,74,115,.45);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.upcard:hover{transform:translateY(-7px);box-shadow:0 30px 58px -22px rgba(110,150,200,.7)}
.upic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  background:linear-gradient(135deg,#BFD7F2,#F4CFDF);color:#2E4A73;animation:upic 5s ease-in-out infinite alternate}
@keyframes upic{from{transform:translateY(-3px) rotate(-3deg)}to{transform:translateY(3px) rotate(3deg)}}
.upt{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.upd{font-size:.88rem;line-height:1.55;color:var(--ink-soft);min-height:3.1em}
.upbtn{margin-top:6px;font-weight:800;font-size:.92rem;color:#fff;padding:11px 26px;border-radius:999px;
  background:linear-gradient(120deg,#2E4A73,#6E96C8,#D98BB0);background-size:200% 100%;box-shadow:0 12px 26px -12px rgba(110,150,200,.8);transition:background-position .5s}
.upcard:hover .upbtn{background-position:100% 0}
.upcard.owned{cursor:default}
.upcard.owned:hover{transform:none;box-shadow:0 18px 40px -22px rgba(46,74,115,.45)}
.upbtn.done{background:linear-gradient(120deg,#5FB78B,#BFE8D4);color:#14361F}
html.dark .upcard{background:rgba(20,28,46,.94)}
html.dark .upsell{background:linear-gradient(150deg,rgba(46,74,115,.42),rgba(138,75,110,.32) 52%,rgba(44,92,70,.36));border-color:rgba(255,255,255,.12)}
html.dark .ownerrow{border-top-color:rgba(255,255,255,.1)}

/* ---- profile views (owner only) ---- */
.viewbox{margin-top:34px;padding:26px 28px;border-radius:26px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(46,74,115,.96),rgba(110,150,200,.92));color:#fff;
  box-shadow:0 24px 54px -26px rgba(46,74,115,.7)}
.viewbox::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.14);
  filter:blur(50px);top:-110px;right:-70px}
.vhead{position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vkick{font-size:.7rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.72}
.vrow{position:relative;display:flex;gap:34px;flex-wrap:wrap;margin-top:14px}
.vstat .vn{font-family:'Space Grotesk',sans-serif;font-size:2.5rem;font-weight:700;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.vstat .vl{font-size:.8rem;font-weight:600;opacity:.78;margin-top:6px}
.vbars{position:relative;display:flex;align-items:flex-end;gap:7px;height:62px;margin-top:20px}
.vbars i{flex:1;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.72);min-height:4px;display:block}
.vnote{position:relative;font-size:.86rem;opacity:.85;margin-top:16px;line-height:1.55}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="app.html">marketplace</a>
      <a class="nav-cta" href="chat.html">chats</a>
    </div>
  </nav>

  <div class="pane wide">
    <div class="profGrid">
      <div class="card reveal on" id="profileCard"><p class="muted center">loading…</p></div>
      <aside>
        <h2 class="page">latest posts</h2>
        <div id="posts" class="mt1"></div>
      </aside>
    </div>
  </div>
</div>

<script type="module">
import { sb, currentUser, blobsHTML, initMotion, logoHTML, esc, timeAgo, avatarHTML, vbadge, isVerified, SOCIAL_FIELDS, clipEmbed, isDark, track } from './app.js';
import { VERIFIED_PRICE, SPOTLIGHT_PRICE, AGENT_PRICE, PAY_URL } from './config.js';
const ACCENTS = { blue:['#BFD7F2','#DCE9F9'], pink:['#F4CFDF','#FBE3EE'], mint:['#BFE8D4','#DFF2E7'], lavender:['#D8CCF2','#EAE3F9'], peach:['#F8D8C4','#FBEBDD'], sand:['#EFE3C6','#F7F0DE'], coral:['#FBC9C2','#FDE2DE'], sky:['#BEE6F5','#DCF2FA'], lime:['#DCEFB8','#EDF7DB'], grape:['#CFC3EE','#E4DDF7'], rose:['#F6C6D8','#FBE0EA'], sunset:['#FBD3A8','#FDE9CE'], ocean:['#B6DCE0','#D9EFF1'], berry:['#E7C2E4','#F3DEF2'], slate:['#CBD5E6','#E3E9F3'] };
const payHref = (item, price) => PAY_URL || ('pay.html?item=' + encodeURIComponent(item) + '&price=' + encodeURIComponent(price));
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const username = new URLSearchParams(location.search).get('u');
const card = document.getElementById('profileCard');
const { data: p } = await sb.from('profiles').select('*').eq('username', username).maybeSingle();

if(!p){
  card.innerHTML = '<p class="muted center">profile not found.</p>';
} else {
  document.title = p.name + ' · ' + (p.role === 'brand' ? 'brand' : 'ugc creator') + ' on YOUgc';
  const md = document.querySelector('meta[name=description]');
  if(md) md.content = (p.bio || (p.name + ' on YOUgc')).slice(0,155);
  // count this as a profile view (not the owner looking at their own page)
  try{ if(!isOwner) track('view:@' + p.username); }catch(e){}
  const u = await currentUser();
  const isOwner = !!(u && u.id === p.id);
  const ac = ACCENTS[p.accent] || ACCENTS.blue;
  card.style.background = isDark()
    ? `radial-gradient(circle at 18% 12%, ${ac[0]}30, transparent 58%), radial-gradient(circle at 88% 85%, ${ac[1]}28, transparent 55%), rgba(18,26,44,.88)`
    : `radial-gradient(circle at 18% 12%, ${ac[0]}B3, transparent 58%), radial-gradient(circle at 88% 85%, ${ac[1]}A6, transparent 55%), radial-gradient(circle at 60% 40%, ${ac[0]}40, transparent 60%), rgba(255,255,255,.8)`;
  const joined = new Date(p.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}).toLowerCase();
  const { count: followers } = await sb.from('follows').select('*',{count:'exact',head:true}).eq('followed', p.id);
  let iFollow = false;
  if(u && !isOwner){
    const { data: f } = await sb.from('follows').select('follower').eq('follower', u.id).eq('followed', p.id).maybeSingle();
    iFollow = !!f;
  }
  const socials = SOCIAL_FIELDS
    .filter(f => p.socials && p.socials[f.key])
    .map(f => `<a href="${esc(p.socials[f.key])}" target="_blank" rel="noopener">${f.label}</a>`)
    .join('');
  card.innerHTML = `
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      ${avatarHTML(p, true)}
      <div style="flex:1;min-width:200px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h1 class="page" style="margin:0">${esc(p.name)}</h1>${vbadge(p)}
          <span class="rolebadge ${p.role}">${p.role==='creator'?'creator':'brand'}</span>
        </div>
        <div class="pmeta">@${esc(p.username)} · <span id="folCount">${followers||0}</span> followers · joined ${joined}</div>
      </div>
    </div>
    ${p.bio ? `<p class="mt2" style="line-height:1.75;font-size:1.18rem;font-weight:500">${esc(p.bio)}</p>` : ''}
    <div id="clipsWrap"></div>
    <div class="ptags mt2">${(p.niches||[]).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
    ${socials ? `<div class="socialrow">${socials}</div>` : ''}
    ${!isOwner ? (u ? `<div class="mt3" style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" id="contact" href="chat.html?u=${encodeURIComponent(p.username)}">message ${esc(p.name.split(' ')[0])} →</a><button class="btn ghost" id="followBtn">${iFollow?'following ✓':'+ follow'}</button></div>` : `<a class="btn mt3" id="contact" href="auth.html">log in to message ${esc(p.name.split(' ')[0])} →</a>`) : ''}
    ${isOwner ? `<div class="ownerrow"><a class="btn" href="onboard.html">edit profile →</a><a class="btn ghost" href="settings.html">settings</a>${(p.agent_until && new Date(p.agent_until)>new Date()) ? `<a class="btn" style="background:linear-gradient(120deg,#6E96C8,#D98BB0);color:#fff" href="agent.html">my agent ✨</a>` : ``}</div>
    <div id="viewsBox"></div>
    <div class="upsell">
      <div class="uphead"><span class="upkick">grow faster</span><h3>get seen by more brands.</h3></div>
      <div class="upgrid">
        ${isVerified(p)?`<div class="upcard owned"><span class="upic">✓</span><div class="upt">verified</div><div class="upd">active on your profile right now</div><span class="upbtn done">active ✓</span></div>`:`<a class="upcard" href="${payHref('verified pack @'+p.username, VERIFIED_PRICE)}"><span class="upic">✓</span><div class="upt">verified</div><div class="upd">the ✓ badge, a highlighted picture and 3 posts a day</div><span class="upbtn">$${VERIFIED_PRICE}/mo</span></a>`}
        ${(p.spotlight_until && new Date(p.spotlight_until)>new Date())?`<div class="upcard owned"><span class="upic">✦</span><div class="upt">spotlight</div><div class="upd">you are pinned on top of the marketplace</div><span class="upbtn done">running ✓</span></div>`:`<a class="upcard" href="${payHref('spotlight @'+p.username, SPOTLIGHT_PRICE)}"><span class="upic">✦</span><div class="upt">spotlight</div><div class="upd">pinned on top of the marketplace for 2 full days</div><span class="upbtn">$${SPOTLIGHT_PRICE}</span></a>`}
        ${(p.agent_until && new Date(p.agent_until)>new Date())?`<div class="upcard owned"><span class="upic">✨</span><div class="upt">your agent</div><div class="upd">your AI agent is active</div><span class="upbtn done">active ✓</span></div>`:`<a class="upcard" href="${payHref((p.role==='brand'?'brand':'creator')+' agent @'+p.username, AGENT_PRICE)}"><span class="upic">✨</span><div class="upt">your agent</div><div class="upd">an AI that prices your deals, fixes your profile and writes your posts</div><span class="upbtn">$${AGENT_PRICE}/mo</span></a>`}
      </div>
    </div>
    <div class="refbox">
      <div class="rtitle">your YOUgc referral link</div>
      <div class="rsub">friend joins through your link: <b>they get 10% off</b> their next purchase, <b>you get 10% off</b> yours. your code: <b>YOUGC10-${esc(p.username.toUpperCase())}</b></div>
      <div class="refrow"><input type="text" id="refLink" readonly><button class="btn small" id="refCopy">copy</button></div>
      <div class="refcount" id="refCount"></div>
    </div>` : ''}
  `;

  // best clips (creators)
  const embeds = (p.clips||[]).map(clipEmbed).filter(Boolean);
  if(embeds.length){
    document.getElementById('clipsWrap').innerHTML =
      '<div class="clipgrid">' + embeds.map(e=>
        `<div class="clip ${e.tall?'tall':'wide'}"><iframe src="${esc(e.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`
      ).join('') + '</div>';
  }

  const fb = document.getElementById('followBtn');
  if(fb){
    fb.addEventListener('click', async ()=>{
      if(fb.textContent.includes('following')){
        await sb.from('follows').delete().eq('follower', u.id).eq('followed', p.id);
        fb.textContent = '+ follow';
        document.getElementById('folCount').textContent = Math.max(0, parseInt(document.getElementById('folCount').textContent)-1);
      } else {
        const { error } = await sb.from('follows').insert({ follower: u.id, followed: p.id });
        if(!error){
          fb.textContent = 'following ✓';
          document.getElementById('folCount').textContent = parseInt(document.getElementById('folCount').textContent)+1;
        }
      }
    });
  }

  if(isOwner){
    const refUrl = location.origin + '/?ref=' + encodeURIComponent(p.username);
  
  // ---- profile views (owner only) ----
  if(isOwner){
    sb.rpc('my_profile_views').then(({data})=>{
      const box = document.getElementById('viewsBox');
      if(!box || !data) return;
      const daily = data.daily || [];
      const max = Math.max(1, ...daily.map(d=>d.c));
      const bars = daily.length
        ? daily.map(d=>`<i style="height:${Math.round(d.c/max*58)+4}px" title="${d.d}: ${d.c}"></i>`).join('')
        : '';
      box.innerHTML = `
        <div class="viewbox">
          <div class="vhead"><span class="vkick">your profile</span></div>
          <div class="vrow">
            <div class="vstat"><div class="vn">${data.d1||0}</div><div class="vl">views today</div></div>
            <div class="vstat"><div class="vn">${data.d7||0}</div><div class="vl">views this week</div></div>
            <div class="vstat"><div class="vn">${data.total||0}</div><div class="vl">views all time</div></div>
          </div>
          ${bars?`<div class="vbars">${bars}</div>`:''}
          <div class="vnote">${(data.d7||0) === 0
            ? 'nobody has been here yet. share your link and add your clips, profiles with 3 clips get opened the most.'
            : 'people are checking you out. keep your clips fresh and your dms open.'}</div>
        </div>`;
    });
  }
  document.getElementById('refLink').value = refUrl;
    document.getElementById('refCopy').addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(refUrl); }catch(e){ document.getElementById('refLink').select(); document.execCommand('copy'); }
      document.getElementById('refCopy').textContent='copied ✓';
      setTimeout(()=>document.getElementById('refCopy').textContent='copy',1600);
    });
    sb.from('referrals').select('id',{count:'exact',head:true}).eq('referrer_username', p.username)
      .then(({count})=>{ if(count) document.getElementById('refCount').textContent = count + (count===1?' friend joined':' friends joined') + ' through your link'; });
    sb.from('referrals').select('referrer_username').eq('referred', p.id).maybeSingle()
      .then(({data})=>{ if(data){ const el=document.getElementById('refCount'); el.textContent += (el.textContent?' · ':'') + 'you joined via @' + data.referrer_username + '. 10% off your next purchase locked in'; } });
  }

  const { data: posts } = await sb.from('posts').select('id,text,img,created_at').eq('user_id', p.id).order('created_at',{ascending:false}).limit(10);
  const wrap = document.getElementById('posts');
  wrap.innerHTML = (posts&&posts.length)
    ? posts.map(x=>`<div class="card post"><div class="pmeta" style="margin-bottom:8px">${timeAgo(x.created_at)}</div><div class="ptext">${esc(x.text)}</div>${x.img?`<a href="${esc(x.img)}" target="_blank" rel="noopener"><img src="${esc(x.img)}" style="max-width:100%;max-height:340px;border-radius:14px;margin-top:12px;display:block;object-fit:cover" loading="lazy"></a>`:''}</div>`).join('')
    : '<div class="card"><p class="muted center">no posts yet.</p></div>';
}
</script>
</body>
</html>

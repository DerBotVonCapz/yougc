<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="get verified, pin your post or turn on your agent. card or crypto."><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>checkout · YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.pane.wide{max-width:1080px}
.view{display:none}
.view.on{display:block;animation:vin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;padding:52px 46px 46px;border-radius:36px;text-align:center;
  border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(150deg,rgba(191,215,242,.5),rgba(244,207,223,.38) 55%,rgba(191,232,212,.46))}
.hero::before{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.6);
  filter:blur(74px);top:-150px;right:-110px;animation:hfl 9s ease-in-out infinite alternate}
@keyframes hfl{from{transform:translate(0,0)}to{transform:translate(-48px,48px)}}
.hero>*{position:relative}
.hic{width:76px;height:76px;margin:0 auto;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#2E4A73;
  background:linear-gradient(135deg,#BFD7F2,#F4CFDF);box-shadow:0 20px 42px -18px rgba(46,74,115,.65);
  animation:hic 5s ease-in-out infinite alternate}
@keyframes hic{from{transform:translateY(-4px) rotate(-4deg)}to{transform:translateY(4px) rotate(4deg)}}
.hic svg{width:38px;height:38px}
.hname{margin-top:22px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:-.05em;line-height:1}
.hhook{margin:16px auto 0;max-width:22em;font-size:1.22rem;line-height:1.5;font-weight:600;color:var(--ink)}
.hhook b{font-weight:800;background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}

.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media(max-width:1000px){.bubbles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.bubbles{grid-template-columns:1fr}.hero{padding:40px 24px 36px}}
.bub{display:flex;gap:15px;align-items:flex-start;padding:24px 24px;border-radius:26px;
  background:rgba(255,255,255,.94);border:2px solid rgba(255,255,255,.9);
  box-shadow:0 18px 42px -26px rgba(46,74,115,.5);
  opacity:0;transform:translateY(12px);animation:bin .5s cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
@keyframes bin{to{opacity:1;transform:none}}
.bub:hover{transform:translateY(-5px);box-shadow:0 28px 54px -26px rgba(110,150,200,.7)}
.hero{}
html.dark .bub{background:rgba(20,28,46,.94);border-color:rgba(255,255,255,.08)}
.bub i{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#BFD7F2,#F4CFDF);color:#2E4A73}
.bub:nth-child(6n+2) i{background:linear-gradient(135deg,#F7D9C4,#F4CFDF);color:#8A4B2E}
.bub:nth-child(6n+3) i{background:linear-gradient(135deg,#C8E6D4,#BFD7F2);color:#245C42}
.bub:nth-child(6n+4) i{background:linear-gradient(135deg,#DCD4F2,#BFD7F2);color:#453B7A}
.bub:nth-child(6n+5) i{background:linear-gradient(135deg,#F4CFDF,#DCD4F2);color:#8A4B6E}
.bub:nth-child(6n) i{background:linear-gradient(135deg,#BFE8D4,#F7D9C4);color:#2F6B4E}
.bub.star{background:linear-gradient(135deg,rgba(191,215,242,.55),rgba(244,207,223,.45))}
html.dark .bub.star{background:linear-gradient(135deg,rgba(46,74,115,.6),rgba(138,75,110,.4))}
.bub i svg{width:23px;height:23px}
.bub .bt{font-weight:800;font-size:1.06rem;letter-spacing:-.02em;line-height:1.25}
.bub .bd{font-size:.89rem;line-height:1.5;color:var(--ink-soft);font-weight:600;margin-top:4px}

@keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.why{margin:26px auto 4px;max-width:24em;text-align:center;font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.035em;line-height:1.25;
  background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0,#E8926B,#5FB78B,#2E4A73);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:flow 11s linear infinite}

/* shared: animated pastel rim that lights up on hover */
.rimmed{position:relative}
.rimmed::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;
  background:linear-gradient(90deg,#BFD7F2,#F4CFDF,#BFE8D4,#F7D9C4,#DCD4F2,#BFD7F2);background-size:300% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s;animation:flow 7s linear infinite}
.rimmed:hover::before{opacity:1}
@media(prefers-reduced-motion:reduce){.why,.rimmed::before{animation:none}}

.paybox{position:relative;overflow:hidden;margin-top:16px;padding:34px 32px 30px;border-radius:30px;text-align:center;
  background:rgba(255,255,255,.96);border:2px solid rgba(255,255,255,.9);box-shadow:0 26px 62px -32px rgba(46,74,115,.55)}
.paybox::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(191,215,242,.55),rgba(244,207,223,.35) 55%,transparent 72%);
  filter:blur(24px);top:-120px;left:-90px;animation:orb 16s ease-in-out infinite alternate}
@keyframes orb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(340px,60px) scale(1.15)}100%{transform:translate(120px,220px) scale(.95)}}
.paybox>*{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.paybox::after{animation:none}}
html.dark .paybox{background:rgba(20,28,46,.96);border-color:rgba(255,255,255,.08)}
.pricerow{display:flex;align-items:baseline;gap:9px;justify-content:center}
.price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:3rem;letter-spacing:-.05em;line-height:1}
.per{font-size:1rem;font-weight:700;color:var(--ink-soft)}
.pricenote{margin-top:7px;font-size:.86rem;font-weight:700;color:var(--ink-soft)}
.choose{font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:26px}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:620px){.ways{grid-template-columns:1fr}}
.way{display:flex;flex-direction:column;align-items:center;gap:7px;padding:24px 20px;border-radius:24px;cursor:pointer;
  text-decoration:none;color:var(--ink);font-family:'Poppins',sans-serif;border:2px solid rgba(30,51,80,.1);
  background:rgba(255,255,255,.72);overflow:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s}
html.dark .way{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--ink)}
.way:not(.primary){border-color:transparent;color:#1E3350;
  background:linear-gradient(100deg,#C8E6D4,#BFD7F2,#DCD4F2,#C8E6D4);
  background-size:300% 100%;animation:flow 16s linear infinite;
  box-shadow:0 18px 40px -22px rgba(70,140,110,.7)}
html.dark .way:not(.primary){color:#12233c}
@media(prefers-reduced-motion:reduce){.way:not(.primary){animation:none}}
.way:hover{transform:translateY(-5px);box-shadow:0 26px 52px -24px rgba(110,150,200,.75)}
.way.primary{border-color:transparent;color:#1E3350;
  background:linear-gradient(100deg,#BFD7F2,#F4CFDF,#C8E6D4,#F7D9C4,#DCD4F2,#BFD7F2);
  background-size:300% 100%;animation:flow 13s linear infinite;
  box-shadow:0 20px 44px -20px rgba(110,150,200,.75)}
.way.primary .wd{opacity:.8}
.way.primary .wt{color:#1E3350}
@media(prefers-reduced-motion:reduce){.way.primary{animation:none}}
.way svg{width:26px;height:26px}
.way .wt{font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.way .wd{font-size:.79rem;font-weight:600;opacity:.78}
.trust{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;justify-content:center}
.trust span{font-size:.73rem;font-weight:700;color:var(--ink-soft);padding:6px 12px;border-radius:999px;background:rgba(191,215,242,.32)}
.backlink{display:inline-flex;align-items:center;gap:7px;margin-bottom:18px;font-size:.86rem;font-weight:700;
  color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:'Poppins',sans-serif}
.backlink:hover{color:var(--ink)}
.coinrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:560px){.coinrow{grid-template-columns:1fr}}
.coinbtn{cursor:pointer;font-family:'Poppins',sans-serif;padding:20px 14px;border-radius:20px;text-align:center;
  border:2px solid transparent;
  background:linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.94)) padding-box,
             linear-gradient(120deg,#BFD7F2,#F4CFDF,#C8E6D4,#BFD7F2) border-box;
  transition:transform .2s,box-shadow .2s}
html.dark .coinbtn{background:linear-gradient(rgba(23,31,52,.95),rgba(23,31,52,.95)) padding-box,
  linear-gradient(120deg,#2E4A73,#8A4B6E,#2C5C46,#2E4A73) border-box}
.coinbtn:hover{transform:translateY(-4px);box-shadow:0 18px 38px -18px rgba(46,74,115,.55)}
.coinbtn .cn{font-weight:800;font-size:1.25rem;color:var(--ink);font-family:'Space Grotesk',sans-serif;display:block}
.coinbtn .ch{font-size:.74rem;font-weight:600;color:var(--ink-soft);margin-top:3px;display:block}
.coinbtn.copied{background:linear-gradient(rgba(191,232,212,.75),rgba(191,232,212,.75)) padding-box,linear-gradient(120deg,#7FBF9E,#BFE8D4) border-box}
.coinbtn.copied .ch{color:#3D7A5C}
label{font-size:.78rem}
.smalllink{display:block;text-align:center;margin-top:18px;font-size:.83rem;font-weight:700;color:var(--ink-soft)}
.bigpay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-family:'Poppins',sans-serif;font-weight:800;font-size:1.04rem;color:#1E3350;
  padding:18px 26px;border-radius:999px;border:none;cursor:pointer;text-decoration:none;
  background:linear-gradient(100deg,#BFD7F2,#F4CFDF,#C8E6D4,#F7D9C4,#DCD4F2,#BFD7F2);
  background-size:300% 100%;animation:flow 13s linear infinite;
  box-shadow:0 18px 40px -18px rgba(110,150,200,.9);transition:transform .22s}
.bigpay:hover{transform:translateY(-2px)}
.bigpay:disabled{opacity:.55;cursor:default;transform:none}
@media(prefers-reduced-motion:reduce){.bigpay{animation:none}}
.ckick{font-size:.68rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.cname{margin-top:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,4vw,2.6rem);
  letter-spacing:-.045em;line-height:1}
.camt{background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.cform{max-width:440px;margin:18px auto 0;text-align:left}
.cmsg{margin-top:14px;font-size:.9rem;font-weight:700;line-height:1.5;padding:14px 16px;border-radius:16px;display:none}
.cmsg.ok{display:block;background:rgba(191,232,212,.5);color:#245C42}
.cmsg.bad{display:block;background:rgba(244,207,223,.55);color:#8A3A4B}
.cmsg b{font-weight:800}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" href="app.html">marketplace</a>
      <a class="nav-cta" href="chat.html">chats</a>
      <a class="nav-cta" id="navProf" href="auth.html">my profile</a>
    </div>
  </nav>
  <div class="pane wide">
    <div class="view on" id="vMain"></div>
    <div class="view" id="vCrypto"></div>
  </div>
</div>

<script type="module">
import { sb, currentUser, myProfile, blobsHTML, initMotion, logoHTML, track } from './app.js';
import { CRYPTO_ADDR, PAY_LINKS, VERIFIED_PRICE, PIN_PRICE, AGENT_PRICE } from './config.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML();
initMotion();

const q = new URLSearchParams(location.search);
let ME = null;
(async ()=>{
  try{
    ME = await myProfile();
    if(ME){
      const np = document.getElementById('navProf');
      np.href = 'profile.html?u=' + encodeURIComponent(ME.username);
      np.textContent = 'my profile';
      const cu = document.getElementById('cUser');
      if(cu && !cu.value) cu.value = '@' + ME.username;
    }
  }catch(e){}
})();
const clean = v => String(v||'').replace(/[<>&"']/g,'');
const sv = (d,f) => `<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const I = {
  badge:  sv('<path d="M12 2.4l2.4 2.1 3.2-.3.9 3.1 2.6 1.9-1.4 2.9 1.4 2.9-2.6 1.9-.9 3.1-3.2-.3L12 21.6l-2.4-2.1-3.2.3-.9-3.1L2.9 15l1.4-2.9L2.9 9.2l2.6-1.9.9-3.1 3.2.3z"/><path d="M8.6 12.2l2.3 2.3 4.5-4.6"/>'),
  pin:    sv('<path d="M4.5 4h15"/><path d="M12 21V9.2"/><path d="M7.2 14L12 9.2 16.8 14"/>'),
  spark:  sv('<path d="M11 2.2l1.85 5.35L18.2 9.4l-5.35 1.85L11 16.6l-1.85-5.35L3.8 9.4l5.35-1.85z"/><path d="M18.3 13.6l.85 2.45 2.45.85-2.45.85-.85 2.45-.85-2.45-2.45-.85 2.45-.85z" opacity=".6"/>', true),
  ring:   sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/>'),
  stack:  sv('<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>'),
  gift:   sv('<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18"/><path d="M12 9v12"/><path d="M12 9S9.5 3.6 7.4 4.6 9.6 9 12 9zm0 0s2.5-5.4 4.6-4.4S14.4 9 12 9z"/>'),
  clock:  sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/>'),
  split:  sv('<rect x="3" y="4" width="7.5" height="16" rx="2"/><rect x="13.5" y="4" width="7.5" height="16" rx="2"/>'),
  rare:   sv('<path d="M12 3l2.3 6.1L20.7 11l-6.4 1.9L12 19l-2.3-6.1L3.3 11l6.4-1.9z"/>'),
  pen:    sv('<path d="M4 20h4l10.3-10.3a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6z"/><path d="M14.4 6.6l3.4 3.4"/>'),
  cycle:  sv('<path d="M20.5 12a8.5 8.5 0 0 1-14.6 6"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-6"/><path d="M18.1 2.6V6H14.7"/><path d="M5.9 21.4V18h3.4"/>'),
  tag:    sv('<path d="M20.5 12.6l-8 8a2 2 0 0 1-2.8 0l-6.3-6.3a2 2 0 0 1-.6-1.4V4.5a2 2 0 0 1 2-2h8.4a2 2 0 0 1 1.4.6l5.9 5.9a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.4"/>'),
  brain:  sv('<path d="M6 4.5h12a2.5 2.5 0 0 1 2.5 2.5v13l-4.2-3H6A2.5 2.5 0 0 1 3.5 14.5V7A2.5 2.5 0 0 1 6 4.5z"/><path d="M8 9.5h8M8 13h5"/>'),
  trend:  sv('<path d="M3 16.5l5.5-5.5 3.5 3.5L20.5 6"/><path d="M14.5 6h6v6"/>'),
  card:   sv('<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/>'),
  coin:   sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.8 9.4c-.5-.9-1.5-1.4-2.8-1.4-1.7 0-2.9.8-2.9 2s1.1 1.7 2.9 2 2.9.8 2.9 2-1.2 2-2.9 2c-1.3 0-2.3-.5-2.8-1.4"/>')
};

const PERKS = {
  verified: {
    ic: I.badge, name: 'verified', price: VERIFIED_PRICE, per: '/ month', note: 'renews every 30 days · cancel any time',
    hook: 'the badge <b>brands look for</b> before they message anyone.',
    bubbles: [
      [I.trend, 'your posts get boosted', 'pushed higher, in front of more people'],
      [I.badge, 'the ✓ on your name', 'on every post, every card, every chat'],
      [I.rare,  'higher in the marketplace', 'you sit above the profiles without it'],
      [I.ring,  'your photo gets the ring', 'in a grid of faces, yours reads first'],
      [I.stack, '3 posts a day', 'instead of 2, so you stay in the feed'],
      [I.gift,  'your first pin, free', 'that is $' + PIN_PRICE + ' back on day one']
    ],
    why: 'be the profile they message first.'
  },
  pin_profile: {
    ic: I.pin, name: 'profile pin', price: PIN_PRICE, per: 'once · 24 hours', note: 'one payment · no subscription',
    hook: '<b>24 hours on top.</b> everyone who opens the marketplace lands on your profile first.',
    bubbles: [
      [I.pin,   'your card, top row', 'above every other creator and brand'],
      [I.ring,  'your whole profile', 'photo, bio, niches, clips, all of it'],
      [I.clock, 'you start the clock', 'run it when your people are awake'],
      [I.rare,  'only a few slots', 'the top row stays rare on purpose'],
      [I.stack, 'every filter, every device', 'top on mobile too, not just desktop'],
      [I.gift,  'you keep what it brings', 'the follows and messages stay yours']
    ],
    why: 'be the first thing they see today.'
  },
  pin_post: {
    ic: I.pin, name: 'post pin', price: PIN_PRICE, per: 'once · 24 hours', note: 'one payment · no subscription',
    hook: '<b>24 hours on top.</b> one post, above every other post in the feed.',
    bubbles: [
      [I.pin,   'first post everyone reads', 'the top of the feed for a full day'],
      [I.split, 'you pick which post', 'the one that actually pitches you'],
      [I.clock, 'you start the clock', 'run it when brands are scrolling'],
      [I.rare,  'only a few slots', 'the top row stays rare on purpose'],
      [I.stack, 'sits above every filter', 'whichever niche they picked'],
      [I.gift,  'you keep what it brings', 'the follows and messages stay yours']
    ],
    why: 'one post at the top beats ten buried.'
  },
  agent: {
    ic: I.spark, name: 'agent', price: AGENT_PRICE, per: '/ month', note: 'renews every 30 days · cancel any time',
    hook: 'your profile, your posts, your deals. <b>fixed as you go.</b>',
    bubbles: [
      [I.ring,  'fixes your profile', 'bio, photo, what to show and where'],
      [I.pen,   'writes your posts', 'so brands stop instead of scroll'],
      [I.trend, 'gets you seen more', 'what to change, in plain words'],
      [I.tag,   'what to charge', 'per deal, based on what you show'],
      [I.spark, 'finds you deals', 'who to message and what to say'],
      [I.brain, 'remembers your goals', 'pick up where you left off']
    ],
    why: 'you lose deals on the profile, not the camera.'
  }
};

const item = q.get('item') || '';
let key = (q.get('perk')||'').toLowerCase();
if(!PERKS[key]) key = Object.keys(PERKS).find(k => item.toLowerCase().includes(k)) || '';
if(!key){
  if(/post/i.test(item) && /pin|featured/i.test(item)) key = 'pin_post';
  else if(/pin|spotlight|featured/i.test(item)) key = 'pin_profile';
}
if(key === 'pin') key = 'pin_profile';
const P = PERKS[key];
const vMain = document.getElementById('vMain'), vCrypto = document.getElementById('vCrypto');

if(!P){
  vMain.innerHTML = `<div class="hero"><div class="hname">pick a perk<span class="grad">.</span></div>
    <div class="hhook">open your profile and choose <b>verified</b>, a <b>pin</b> or your <b>agent</b>.</div></div>
    <div class="paybox"><a class="way primary" href="app.html"><span class="wt">go to the marketplace →</span></a></div>`;
} else {
  const link = PAY_LINKS[key] || '';
  vMain.innerHTML = `
    <div class="hero">
      <div class="hic">${P.ic}</div>
      <div class="hname">${P.name}<span class="grad">.</span></div>
      <div class="hhook">${P.hook}</div>
    </div>

    <div class="bubbles">
      ${P.bubbles.map((b,i)=>`<div class="bub rimmed" style="animation-delay:${.07*i+.12}s"><i>${b[0]}</i>
        <div><div class="bt">${b[1]}</div><div class="bd">${b[2]}</div></div></div>`).join('')}
    </div>

    <div class="why">${P.why}</div>

    <div class="paybox">
      <div class="pricerow"><span class="price">$${P.price}</span><span class="per">${P.per}</span></div>
      <div class="pricenote">${P.note}</div>
      <div class="choose">how do you want to pay</div>
      <div class="ways">
        ${link ? `<a class="way primary rimmed" id="wCard" href="${link}" target="_blank" rel="noopener">${I.card}
          <span class="wt">card</span><span class="wd">visa, mastercard, apple pay</span></a>` : ''}
        <button class="way rimmed" id="wCrypto">${I.coin}<span class="wt">crypto</span><span class="wd">SOL · ETH · BTC</span></button>
      </div>
      <div class="trust"><span>🔒 card payments run on stripe</span><span>put your @username in at checkout</span><span>got a code? add it at checkout</span></div>
    </div>`;

  vCrypto.innerHTML = `
    <button class="backlink" id="cBack">← back to how you pay</button>
    <div class="paybox" style="margin-top:0">
      <div class="ckick">paying with crypto</div>
      <div class="cname">${P.name} <span class="camt">$${P.price}</span></div>
      <div class="choose" style="margin-top:24px">1 · tap a coin to copy the address</div>
      <div class="coinrow" id="coinRow"></div>
      <div class="choose" style="margin-top:30px">2 · send the amount, then paste the link</div>
      <div class="cform">
        <label>your @username on YOUgc</label>
        <input type="text" id="cUser" placeholder="@yourname" maxlength="40">
        <label class="mt2">transaction link or hash</label>
        <input type="text" id="cTx" placeholder="https://solscan.io/tx/..." maxlength="200">
        <label class="mt2">promo code <span style="text-transform:none;font-weight:400">(optional)</span></label>
        <input type="text" id="promo" placeholder="YOUGC10" maxlength="40">
        <button class="bigpay" id="cSend" style="margin-top:18px">confirm my payment →</button>
        <a class="btn ghost full mt1" id="mailBtn" href="mailto:yougcmarket@gmail.com" style="display:none">send it by email instead</a>
        <div class="cmsg" id="cMsg"></div>
      </div>
      <a class="smalllink" href="mailto:yougcmarket@gmail.com">another coin, or something not working? write to us</a>
    </div>`;

  try{ track('pay·view·'+key); }catch(e){}
  document.getElementById('wCard')?.addEventListener('click', ()=>{ try{ track('pay·card·'+key); }catch(e){} });

  const show = which => {
    vMain.classList.toggle('on', which === 'main');
    vCrypto.classList.toggle('on', which === 'crypto');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('wCrypto').addEventListener('click', ()=>{ try{ track('pay·crypto·'+key); }catch(e){} show('crypto'); });
  document.getElementById('cBack').addEventListener('click', ()=> show('main'));

  const coinRow = document.getElementById('coinRow');
  coinRow.innerHTML = Object.keys(CRYPTO_ADDR).map(k=>
    `<button class="coinbtn" data-c="${clean(k)}"><span class="cn">${clean(k)}</span><span class="ch">tap to copy</span></button>`).join('');
  coinRow.addEventListener('click', e=>{
    const b = e.target.closest('.coinbtn'); if(!b) return;
    const addr = CRYPTO_ADDR[b.dataset.c]; if(!addr) return;
    let ok = false;
    try{
      const t=document.createElement('textarea'); t.value=addr; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.focus(); t.select(); ok = document.execCommand('copy'); t.remove();
    }catch(err){}
    if(!ok && navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(addr).catch(()=>{}); }
    coinRow.querySelectorAll('.coinbtn').forEach(x=>{ x.classList.remove('copied'); x.querySelector('.ch').textContent='tap to copy'; });
    b.classList.add('copied'); b.querySelector('.ch').textContent='copied ✓'; chosenCoin = b.dataset.c;
    setTimeout(()=>{ b.classList.remove('copied'); b.querySelector('.ch').textContent='tap to copy'; }, 2600);
  });

  let chosenCoin = '';
  const msgEl = () => document.getElementById('cMsg');

  function buildMail(){
    const user = (document.getElementById('cUser').value || '').trim();
    const tx = (document.getElementById('cTx').value || '').trim();
    const code = (document.getElementById('promo').value || '').trim();
    const subj = 'crypto payment: ' + P.name + ' ($' + P.price + ')' + (user ? ' — ' + user : '');
    const body = 'perk: ' + P.name + '\nmy @username: ' + user + '\ncoin: ' + (chosenCoin || '') +
                 '\ntransaction: ' + tx + (code ? '\npromo code: ' + code : '');
    document.getElementById('mailBtn').href = 'mailto:yougcmarket@gmail.com?subject=' +
      encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  }

  document.getElementById('cUser').addEventListener('input', buildMail);
  document.getElementById('cTx').addEventListener('input', buildMail);
  document.getElementById('promo').addEventListener('input', buildMail);
  buildMail();

  document.getElementById('cSend').addEventListener('click', async ()=>{
    const btn = document.getElementById('cSend');
    const user = (document.getElementById('cUser').value || '').trim().replace(/^@/,'');
    const tx = (document.getElementById('cTx').value || '').trim();
    const code = (document.getElementById('promo').value || '').trim();
    const m = msgEl();
    if(!user){ m.className = 'cmsg bad'; m.textContent = 'we need your @username to find your profile'; return; }
    if(tx.length < 8){ m.className = 'cmsg bad'; m.textContent = 'paste the transaction link or hash so we can check it'; return; }
    btn.disabled = true; btn.textContent = 'checking…';
    try{
      const u = await currentUser();
      if(!u) throw new Error('not logged in');
      const { error } = await sb.from('payments').insert({
        user_id: u.id, username: user, perk: key, coin: chosenCoin || null, tx: tx,
        note: code ? ('promo ' + code) : null
      });
      if(error) throw error;
      try{ track('pay·crypto·sent·'+key); }catch(e){}
      m.className = 'cmsg ok';
      m.innerHTML = 'got it. we check the transaction and switch <b>' + P.name + '</b> on, usually within the hour. you can close this page.';
      btn.textContent = 'sent ✓';
    }catch(err){
      buildMail();
      m.className = 'cmsg bad';
      m.textContent = 'could not send it from here. use the email button below and it gets sorted the same way.';
      document.getElementById('mailBtn').style.display = '';
      btn.disabled = false; btn.textContent = 'confirm my payment →';
    }
  });
}
</script>
</body>
</html>

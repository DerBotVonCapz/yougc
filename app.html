<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marketplace — YOUgc</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .floatlogo{position:fixed;z-index:60;font-family:'Space Grotesk','Poppins',sans-serif;font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:-.05em;
    display:inline-flex;align-items:baseline;
    background:linear-gradient(100deg,#2E4A73 0%,#5B84B8 34%,#6E96C8 52%,#D98BB0 78%,#C9A0C4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:.9;user-select:none;pointer-events:none;will-change:transform;left:0;top:0}
  .floatlogo .u{font-size:.94em;font-style:italic;letter-spacing:-.045em}
  .floatlogo .gc{font-size:.86em;margin-left:-.015em;font-style:italic;letter-spacing:normal}
  .floatlogo .gc::after{content:'.';font-style:normal;font-weight:800;margin-left:.04em;padding-right:.1em}
  .prep{text-align:center;padding:2vh 0 6vh;max-width:100% !important}
  .prep .big{font-family:'Space Grotesk','Poppins',sans-serif;font-weight:700;letter-spacing:-.05em;line-height:.98;
    font-size:clamp(2.8rem,8.6vw,7.6rem);white-space:nowrap;
    background:linear-gradient(95deg,#2E4A73 0%,#6E96C8 46%,#D98BB0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .prep .big2{font-family:'Space Grotesk','Poppins',sans-serif;font-weight:700;letter-spacing:-.04em;line-height:1;
    font-size:clamp(1.8rem,5.2vw,4.4rem);color:var(--ink);margin-top:6px}
  .prep .dots span{display:inline-block;animation:blink 1.4s infinite}
  .prep .dots span:nth-child(2){animation-delay:.2s}
  .prep .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
  .prep .sub{margin:34px auto 0;max-width:620px;font-size:clamp(1.05rem,1.9vw,1.35rem);font-weight:600;line-height:1.65;color:var(--ink)}
  .prep .sub .grad2{background:linear-gradient(90deg,#2E4A73,#6E96C8,#D98BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .prepmarq{margin:6vh 0 0;overflow:hidden;white-space:nowrap;padding:10px 0}
  .prepmarq .ptrack{display:inline-block;animation:pscroll 36s linear infinite;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:1.5rem;color:rgba(30,51,80,.16)}
  .prepmarq .ptrack b{color:rgba(110,150,200,.45);font-weight:700}
  @keyframes pscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <nav class="top">
    <span id="logo"></span>
    <div class="navlinks">
      <a class="nav-cta" id="mypage" href="#">my profile</a>
    </div>
  </nav>

  <div class="appwrap" id="appwrap">
    <h1 class="page">the <span class="grad">marketplace.</span></h1>

    <div class="card" id="composer" style="display:none;margin-bottom:18px">
      <label style="margin-top:0">your post</label>
      <textarea id="postText" maxlength="500" placeholder="what can you shoot right now? where are you? share an idea, an achievement, what you'd love to create next…"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span class="muted">up to 2 posts a day. make them count</span>
        <button class="btn small" id="postBtn">post</button>
      </div>
      <div class="msg" id="postMsg"></div>
    </div>

    <div class="tabs">
      <span class="tab on" data-tab="all">everyone</span>
      <span class="tab" data-tab="mine">my categories</span>
    </div>
    <div class="chips" id="filterChips" style="margin-bottom:18px"></div>

    <div id="feed"><p class="muted center mt3">loading…</p></div>
  </div>
</div>

<script type="module">
import { sb, requireAuth, NICHES, blobsHTML, initMotion, logoHTML, esc, timeAgo, avatarHTML, showMsg } from './app.js';
import { LAUNCHED } from './config.js';
document.getElementById('bg').outerHTML = blobsHTML();
document.getElementById('logo').outerHTML = logoHTML('app.html');
initMotion();

const ctx = await requireAuth();
if(!ctx) throw new Error('redirecting');
const me = ctx.profile;

document.getElementById('mypage').href = 'profile.html?u=' + encodeURIComponent(me.username);

if(!LAUNCHED){
  // ---------- PRE-LAUNCH HOLDING SCREEN ----------
  document.getElementById('appwrap').style.maxWidth='100%';
  document.getElementById('appwrap').innerHTML = `
    <div class="prep">
      <div class="big">MARKETPLACE</div>
      <div class="big2">in preparation<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
      <p class="sub">
        creators and brands are joining <span class="grad2">right now</span>.<br>
        your profile is locked in. you'll be here from <span class="grad2">day one</span> when the doors open.
      </p>
      <a class="btn mt3" id="prepProfile" href="#" style="font-size:1.05rem;padding:17px 38px">my profile →</a>
      <div class="card" style="max-width:480px;margin:36px auto 0;text-align:left">
        <div style="font-weight:700;margin-bottom:10px">get an email the moment the doors open</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <input type="email" id="wlEmail" style="flex:1;min-width:180px">
          <button class="btn small" id="wlBtn" style="padding:13px 24px">notify me</button>
        </div>
        <div class="msg" id="wlMsg"></div>
      </div>
      <div class="prepmarq"><div class="ptrack">
        creators joining &nbsp;·&nbsp; <b>brands watching</b> &nbsp;·&nbsp; profiles building &nbsp;·&nbsp; <b>deals loading</b> &nbsp;·&nbsp; doors opening soon &nbsp;·&nbsp; creators joining &nbsp;·&nbsp; <b>brands watching</b> &nbsp;·&nbsp; profiles building &nbsp;·&nbsp; <b>deals loading</b> &nbsp;·&nbsp; doors opening soon &nbsp;·&nbsp;
      </div></div>
    </div>`;
  document.getElementById('prepProfile').href = 'profile.html?u=' + encodeURIComponent(me.username);

  // launch notification
  const wlInp=document.getElementById('wlEmail'), wlBtn=document.getElementById('wlBtn'), wlMsg=document.getElementById('wlMsg');
  wlInp.value = ctx.user.email || '';
  wlBtn.addEventListener('click', async ()=>{
    const email=wlInp.value.trim().toLowerCase();
    wlMsg.className='msg';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showMsg(wlMsg,'enter a valid email.'); return; }
    wlBtn.innerHTML='<span class="spin"></span>';
    const { error } = await sb.from('waitlist').insert({ email });
    wlBtn.textContent='notify me';
    if(error){
      if((error.message||'').includes('duplicate')) showMsg(wlMsg,"you're on the list already.", true);
      else showMsg(wlMsg,'something went wrong. try again.');
    } else showMsg(wlMsg,"locked in. you'll get the launch email.", true);
  });

  // ---------- logo drifting in space, nudged by your cursor ----------
  const fl = document.createElement('div');
  fl.className = 'floatlogo';
  fl.innerHTML = '<span class="you">YO</span><span class="u">U</span><span class="gc">gc</span>';
  document.body.appendChild(fl);
  const rect = () => fl.getBoundingClientRect();
  let x = innerWidth*0.14, y = innerHeight*0.68;
  let vx = 0.5, vy = -0.35;
  function loop(){
    const w = rect().width || 140, h = rect().height || 50;
    x += vx; y += vy;
    vx *= 0.996; vy *= 0.996;
    const sp = Math.hypot(vx,vy);
    if(sp < 0.35){ vx *= 0.5/Math.max(sp,.01); vy *= 0.5/Math.max(sp,.01); }
    if(sp > 6){ vx *= 6/sp; vy *= 6/sp; }
    if(x < 0){ x = 0; vx = Math.abs(vx); }
    if(y < 0){ y = 0; vy = Math.abs(vy); }
    if(x + w > innerWidth){ x = innerWidth - w; vx = -Math.abs(vx); }
    if(y + h > innerHeight){ y = innerHeight - h; vy = -Math.abs(vy); }
    fl.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(loop);
  }
  loop();
  window.addEventListener('mousemove', e=>{
    const w = rect().width || 140, h = rect().height || 50;
    const cx = x + w/2, cy = y + h/2;
    const dx = cx - e.clientX, dy = cy - e.clientY;
    const dist = Math.hypot(dx,dy);
    if(dist < 120 && dist > 1){
      const f = (120-dist)/120 * 0.9;
      vx += (dx/dist)*f; vy += (dy/dist)*f;
    }
  });

} else {
  // ---------- LIVE MARKETPLACE ----------
  {
    document.getElementById('composer').style.display='block';
    if(me.role === 'brand'){
      document.getElementById('postText').placeholder = "what are you looking for? e.g. 3 fitness creators for a winter campaign, german or english, video + photos…";
    }
    document.getElementById('postBtn').addEventListener('click', async ()=>{
      const t = document.getElementById('postText').value.trim();
      const msg = document.getElementById('postMsg'); msg.className='msg';
      if(!t){ showMsg(msg,'write something first.'); return; }
      const btn=document.getElementById('postBtn'); btn.innerHTML='<span class="spin"></span>';
      const { error } = await sb.from('posts').insert({ user_id: me.id, text: t });
      if(error){
        showMsg(msg, (error.message||'').includes('row-level') ? 'you posted in the last 12 hours. come back a bit later.' : error.message);
      } else {
        document.getElementById('postText').value='';
        showMsg(msg, me.role==='brand' ? 'posted. creators can see it now.' : 'posted. brands can see it now.', true);
        load();
      }
      btn.textContent='post';
    });
  }

  let tab='all', activeNiches=new Set();
  const filterEl=document.getElementById('filterChips');
  filterEl.innerHTML = NICHES.map(n=>`<span class="chip filter" data-n="${esc(n)}">${esc(n)}</span>`).join('');
  filterEl.addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    const n=c.dataset.n;
    activeNiches.has(n)?activeNiches.delete(n):activeNiches.add(n);
    c.classList.toggle('on');
    load();
  });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); tab=t.dataset.tab; load();
  }));

  async function load(){
    const feed=document.getElementById('feed');
    feed.innerHTML='<p class="muted center mt3">loading…</p>';
    const { data, error } = await sb.from('posts')
      .select('id,text,created_at,profiles(id,username,name,avatar_url,niches,role)')
      .order('created_at',{ascending:false}).limit(100);
    if(error){ feed.innerHTML=`<p class="muted center mt3">${esc(error.message)}</p>`; return; }
    let rows = (data||[]).filter(p=>p.profiles);
    if(tab==='mine' && me.niches?.length){
      const mine=new Set(me.niches);
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>mine.has(n)));
    }
    if(activeNiches.size){
      rows = rows.filter(p=>(p.profiles.niches||[]).some(n=>activeNiches.has(n)));
    }
    if(!rows.length){
      feed.innerHTML = `<div class="card center"><p class="muted">nothing here yet${tab==='mine'?' for your categories':''} — check back soon, or switch filters.</p></div>`;
      return;
    }
    feed.innerHTML = rows.map(p=>`
      <div class="card post">
        <div class="phead">
          ${avatarHTML(p.profiles)}
          <div>
            <a class="pname" href="profile.html?u=${encodeURIComponent(p.profiles.username)}">${esc(p.profiles.name)}</a> <span class="rolebadge ${p.profiles.role}">${p.profiles.role==='creator'?'creator':'brand'}</span>
            <div class="pmeta">@${esc(p.profiles.username)} · ${timeAgo(p.created_at)}</div>
          </div>
        </div>
        <div class="ptext">${esc(p.text)}</div>
        <div class="ptags">${(p.profiles.niches||[]).slice(0,6).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
      </div>`).join('');
  }
  load();
}
</script>
</body>
</html>
